<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ST-Agentic UI 原型</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .thin-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .thin-scroll::-webkit-scrollbar-track { background: transparent; }
    .thin-scroll::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--muted-foreground) 30%, transparent);
      border-radius: 9999px;
    }
    .pill-soft-primary {
      background: color-mix(in srgb, var(--primary) 14%, transparent);
      color: var(--primary);
      border-color: color-mix(in srgb, var(--primary) 32%, transparent);
    }
    .pill-soft-success {
      background: color-mix(in srgb, var(--success) 14%, transparent);
      color: var(--success);
      border-color: color-mix(in srgb, var(--success) 32%, transparent);
    }
    .pill-soft-warning {
      background: color-mix(in srgb, var(--warning) 14%, transparent);
      color: var(--warning);
      border-color: color-mix(in srgb, var(--warning) 32%, transparent);
    }
    .pill-soft-error {
      background: color-mix(in srgb, var(--error) 14%, transparent);
      color: var(--error);
      border-color: color-mix(in srgb, var(--error) 32%, transparent);
    }
    .diff-del {
      background: color-mix(in srgb, var(--error) 14%, transparent);
      color: var(--error);
    }
    .diff-add {
      background: color-mix(in srgb, var(--success) 14%, transparent);
      color: var(--success);
    }
    .shadow-boundary-badge {
      background: color-mix(in srgb, var(--primary) 10%, transparent);
      border: 1px dashed color-mix(in srgb, var(--primary) 40%, transparent);
    }
    .mobile-shell {
      width: 390px;
      height: 780px;
      max-width: 100%;
      border-radius: 28px;
      border: 6px solid var(--border);
      overflow: hidden;
      box-shadow: 0 20px 50px color-mix(in srgb, var(--foreground) 15%, transparent);
    }
    .mobile-control {
      font-size: 16px !important;
      min-height: 40px;
    }
    .touch-target {
      min-height: 40px;
      min-width: 40px;
    }

    /* Shadow DOM 独立 Dark / Light 双主题色板（默认 Dark 对齐 SillyTavern 默认深色风格） */
    #theme-scope[data-theme="dark"] {
      --background: #14161b;
      --sidebar: #1b1e25;
      --content: #101216;
      --card: #20242c;
      --border: #2f3542;
      --card-border: #2a303c;
      --foreground: #e6e9ef;
      --muted-foreground: #9aa3b2;
      --primary: #6c8cff;
      --primary-foreground: #ffffff;
      --secondary: #2a303c;
      --secondary-foreground: #e6e9ef;
      --success: #34d399;
      --warning: #fbbf24;
      --error: #f87171;
      color-scheme: dark;
    }
    #theme-scope[data-theme="light"] {
      --background: #f4f6fa;
      --sidebar: #eef1f6;
      --content: #f8fafc;
      --card: #ffffff;
      --border: #dbe1eb;
      --card-border: #e5eaf2;
      --foreground: #181c24;
      --muted-foreground: #5f697a;
      --primary: #3b66f5;
      --primary-foreground: #ffffff;
      --secondary: #e8edf5;
      --secondary-foreground: #181c24;
      --success: #10b981;
      --warning: #d97706;
      --error: #dc2626;
      color-scheme: light;
    }
  </style>
</head>
<body class="m-0 p-0 antialiased">
<div id="theme-scope" data-theme="dark" class="bg-[var(--background)] text-[var(--foreground)] min-h-screen flex flex-col transition-colors duration-150">

  <!-- 顶部原型场景切换栏 -->
  <header class="shrink-0 bg-[var(--sidebar)] border-b border-[var(--border)] px-3 sm:px-5 py-2.5 flex flex-wrap items-center justify-between gap-2">
    <div class="flex items-center gap-2.5">
      <div class="w-7 h-7 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] flex items-center justify-center shadow-sm">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </div>
      <div>
        <div class="text-sm font-semibold leading-tight flex items-center gap-2">
          <span>ST-Agentic UI 原型</span>
          <span class="text-[11px] px-1.5 py-0.5 rounded border border-[var(--border)] bg-[var(--content)] text-[var(--muted-foreground)] font-normal">Shadow DOM 独立主题</span>
        </div>
        <div class="text-[11px] text-[var(--muted-foreground)]">100% 保留 ST 原生聊天 UI · 独立深/浅双色控制台与移动端页面栈</div>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <!-- Dark / Light 主题切换 -->
      <div class="flex items-center gap-1 bg-[var(--content)] p-1 rounded-lg border border-[var(--border)] text-xs">
        <button id="theme-btn-dark" onclick="setTheme('dark')" class="px-2 py-1 rounded-md cursor-pointer flex items-center gap-1 transition">🌙 深色</button>
        <button id="theme-btn-light" onclick="setTheme('light')" class="px-2 py-1 rounded-md cursor-pointer flex items-center gap-1 transition">☀️ 浅色</button>
      </div>

      <!-- 场景切换 -->
      <div class="flex items-center gap-1 bg-[var(--content)] p-1 rounded-lg border border-[var(--border)]">
        <button id="scene-chat" onclick="switchScene('chat')" class="px-2.5 py-1.5 rounded-md text-xs font-medium transition cursor-pointer flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>ST 原生挂载预览</span>
        </button>
        <button id="scene-desktop" onclick="switchScene('desktop')" class="px-2.5 py-1.5 rounded-md text-xs font-medium transition cursor-pointer flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          <span>桌面控制台</span>
        </button>
        <button id="scene-mobile" onclick="switchScene('mobile')" class="px-2.5 py-1.5 rounded-md text-xs font-medium transition cursor-pointer flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
          <span>移动端 390×844</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Toast 通知浮层 -->
  <div id="toast-box" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- 导入 / 迁移 / 嵌卡模拟弹窗（用于演示部分兼容/自动迁移反馈） -->
  <div id="modal-overlay" class="hidden fixed inset-0 z-40 bg-black/60 backdrop-blur-sm items-center justify-center p-4">
    <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl max-w-lg w-full shadow-2xl overflow-hidden">
      <div class="px-4 py-3 border-b border-[var(--border)] flex items-center justify-between">
        <span id="modal-title" class="font-semibold text-sm">操作面板</span>
        <button onclick="closeModal()" class="p-1.5 rounded-md hover:bg-[var(--secondary)] text-[var(--muted-foreground)] cursor-pointer">✕</button>
      </div>
      <div id="modal-body" class="p-4 text-xs space-y-3 max-h-[70vh] overflow-y-auto thin-scroll"></div>
      <div class="px-4 py-2.5 border-t border-[var(--border)] bg-[var(--content)] flex justify-end gap-2">
        <button onclick="closeModal()" class="px-3 py-1.5 rounded-md border border-[var(--border)] text-xs cursor-pointer hover:bg-[var(--secondary)]">关闭</button>
      </div>
    </div>
  </div>

  <!-- 主渲染容器 -->
  <main id="app-root" class="flex-1 p-3 sm:p-5 flex justify-center items-start overflow-auto"></main>
</div>

  <script>
    // =========================================================================
    // 1. 原型核心状态模型（与 ARCHITECTURE.md 契约保持一致）
    // =========================================================================
    const NAV_ITEMS = [

    // =========================================================================
    // 5. 九大视图主画布渲染函数（桌面与移动端详页共用同一套数据驱动内核）
    // =========================================================================
    function renderActiveTabContent(isMobile) {
      switch (state.activeTab) {
        case 'files': return renderFilesTab(isMobile);
        case 'logs': return renderLogsTab(isMobile);
        case 'cache': return renderCacheTab(isMobile);
        case 'agents': return renderAgentsTab(isMobile);
        case 'pipeline': return renderPipelineTab(isMobile);
        case 'tools': return renderToolsTab(isMobile);
        case 'regex': return renderRegexTab(isMobile);
        case 'wi': return renderWITab(isMobile);
        case 'connections': return renderConnectionsTab(isMobile);
        default: return '';
      }
    }

    // ----- ① 文件与内容覆盖 -----
    function renderFilesTab(isMobile) {
      const list = state.files.filter(f => state.fileFilter === 'all' || f.ns === state.fileFilter);
      const active = state.files.find(f => f.id === state.selectedFileId) || list[0];
      const inpCls = isMobile ? 'mobile-control' : 'text-xs';

      const masterHtml = `
        <div class="flex flex-col h-full">
          <div class="p-2.5 border-b border-[var(--border)] flex flex-wrap gap-1">

              <button onclick="state.fileFilter='${k}';render();" class="px-2 py-1 rounded text-[11px] cursor-pointer border ${state.fileFilter===k ? 'pill-soft-primary font-medium' : 'border-transparent hover:bg-[var(--secondary)] text-[var(--muted-foreground)]'} ${isMobile ? 'touch-target' : ''}">${lbl}</button>
            `).join('')}
          </div>
          <div class="flex-1 overflow-y-auto thin-scroll p-2 space-y-1.5">
            ${list.map(f => `
              <button onclick="state.selectedFileId='${f.id}'; ${isMobile ? 'state.mobilePushDetail=true;' : ''} render();" class="w-full text-left p-2.5 rounded-lg border transition cursor-pointer ${active?.id===f.id && !isMobile ? 'bg-[var(--content)] border-[var(--primary)]/50' : 'border-[var(--card-border)] hover:bg-[var(--secondary)]'} ${isMobile ? 'min-h-[48px]' : ''}">
                <div class="text-xs font-mono font-medium truncate">${esc(f.path)}</div>
                <div class="mt-1 flex items-center justify-between gap-2 text-[11px] text-[var(--muted-foreground)]">
                  <span>${esc(f.source)}</span>
                  <span class="px-1.5 py-0.5 rounded bg-[var(--sidebar)] border border-[var(--border)] text-[10px]">${esc(f.layer)}</span>
                </div>
              </button>
            `).join('')}
          </div>
        </div>
      `;

      const detailHtml = active ? `
        <div class="flex flex-col h-full">
          <div class="px-3.5 py-2.5 border-b border-[var(--border)] bg-[var(--content)] flex flex-wrap items-center justify-between gap-2">
            <div>
              <div class="text-xs font-mono font-semibold">${esc(active.path)}</div>
              <div class="text-[11px] text-[var(--muted-foreground)]">归属层: ${esc(active.layer)} · 来源: ${esc(active.source)}</div>
            </div>
            <div class="flex items-center gap-1.5">
              <div class="flex p-0.5 rounded-lg bg-[var(--sidebar)] border border-[var(--border)] text-[11px]">
                <button onclick="state.fileViewMode='edit';render();" class="px-2.5 py-1 rounded cursor-pointer ${state.fileViewMode==='edit' ? 'bg-[var(--card)] font-medium shadow-sm' : 'text-[var(--muted-foreground)]'}">原位编辑</button>
                <button onclick="state.fileViewMode='diff';render();" class="px-2.5 py-1 rounded cursor-pointer ${state.fileViewMode==='diff' ? 'bg-[var(--card)] font-medium shadow-sm' : 'text-[var(--muted-foreground)]'}">Diff 对比</button>
              </div>
              <button onclick="saveActiveFile()" class="px-2.5 py-1 rounded-md bg-[var(--primary)] text-[var(--primary-foreground)] text-[11px] font-medium cursor-pointer ${isMobile ? 'touch-target' : ''}">保存</button>
              <button onclick="restoreActiveFile()" class="px-2.5 py-1 rounded-md border border-[var(--border)] text-[11px] hover:bg-[var(--secondary)] cursor-pointer ${isMobile ? 'touch-target' : ''}">恢复原版</button>
            </div>
          </div>
          <div class="flex-1 p-3.5 overflow-y-auto thin-scroll flex flex-col gap-2">
            ${state.fileViewMode === 'edit' ? `
              <textarea id="file-editor-area" class="w-full flex-1 min-h-[300px] p-3 rounded-lg bg-[var(--content)] border border-[var(--border)] font-mono leading-relaxed focus:outline-none focus:border-[var(--primary)] ${inpCls}">${esc(active.content)}</textarea>
            ` : `
              <div class="rounded-lg border border-[var(--border)] overflow-hidden font-mono text-xs">
                <div class="px-3 py-1.5 bg-[var(--sidebar)] border-b border-[var(--border)] text-[11px] text-[var(--muted-foreground)]">基线 / 原文 vs 当前分支 (${esc(active.layer)})</div>
                <div class="p-3 space-y-1 bg-[var(--content)]">
                  ${active.baseContent.split('\n').map(line => `<div class="diff-del px-2 py-0.5 rounded">- ${esc(line)}</div>`).join('')}
                  ${active.content.split('\n').map(line => `<div class="diff-add px-2 py-0.5 rounded">+ ${esc(line)}</div>`).join('')}
                </div>
              </div>
            `}
          </div>
        </div>
      ` : '';

      return renderSplitOrStack(isMobile, masterHtml, detailHtml, '选择文件或覆写条目');
    }

    function saveActiveFile() {
      const active = state.files.find(f => f.id === state.selectedFileId);
      const area = document.getElementById('file-editor-area');
      if (active && area) {
        active.content = area.value;
        active.source = 'user-edit';
        showToast(`已保存至当前分支 ${active.layer}`, 'success');
        render();
      }
    }

    function restoreActiveFile() {
      const active = state.files.find(f => f.id === state.selectedFileId);
      if (active) {
        active.content = active.baseContent;
        showToast('已清除当前层覆写并恢复基线内容', 'warning');
        render();
      }
    }

    // ----- ② 生成与工具日志 -----
    function renderLogsTab(isMobile) {
      const list = state.logs.filter(l => state.logFloorFilter === 'all' || String(l.floor) === state.logFloorFilter);
      const active = state.logs.find(l => l.id === state.selectedLogId) || list[0];

      const masterHtml = `
        <div class="flex flex-col h-full">
          <div class="p-2.5 border-b border-[var(--border)] flex items-center gap-1">
            ${[['all','全部楼层'], ['12','仅 #12 楼'], ['10','仅 #10 楼']].map(([k, lbl]) => `
              <button onclick="state.logFloorFilter='${k}';render();" class="px-2 py-1 rounded text-[11px] cursor-pointer border ${state.logFloorFilter===k ? 'pill-soft-primary font-medium' : 'border-transparent hover:bg-[var(--secondary)] text-[var(--muted-foreground)]'} ${isMobile ? 'touch-target' : ''}">${lbl}</button>
            `).join('')}
          </div>
          <div class="flex-1 overflow-y-auto thin-scroll p-2 space-y-1.5">
            ${list.map(l => {
              const rate = ((l.cachedTokens / l.inputTokens) * 100).toFixed(1);
              return `
                <button onclick="state.selectedLogId='${l.id}'; ${isMobile ? 'state.mobilePushDetail=true;' : ''} render();" class="w-full text-left p-2.5 rounded-lg border transition cursor-pointer ${active?.id===l.id && !isMobile ? 'bg-[var(--content)] border-[var(--primary)]/50' : 'border-[var(--card-border)] hover:bg-[var(--secondary)]'}">
                  <div class="flex items-center justify-between text-xs font-medium">
                    <span>#${l.floor} · ${esc(l.agent)}</span>
                    <span class="text-[10px] px-1.5 py-0.5 rounded border pill-soft-success">${rate}% 命中</span>
                  </div>
                  <div class="mt-1 flex items-center justify-between text-[11px] text-[var(--muted-foreground)]">
                    <span>${esc(l.phase)} · ${l.steps.length} 步</span>
                    <span>${esc(l.duration)}</span>
                  </div>
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;

      const hitRate = active ? ((active.cachedTokens / active.inputTokens) * 100).toFixed(1) : '0';
      const detailHtml = active ? `
        <div class="flex flex-col h-full">
          <div class="px-3.5 py-2.5 border-b border-[var(--border)] bg-[var(--content)] flex flex-wrap items-center justify-between gap-2">

              <div class="text-xs font-semibold">#${active.floor} · ${esc(active.agent)} <span class="font-mono text-[11px] text-[var(--muted-foreground)]">(${esc(active.model)})</span></div>
              <div class="text-[11px] text-[var(--muted-foreground)]">阶段: ${esc(active.phase)} · 耗时 ${esc(active.duration)}</div>
            </div>
            <div class="flex p-0.5 rounded-lg bg-[var(--sidebar)] border border-[var(--border)] text-[11px]">
              <button onclick="state.logViewTab='steps';render();" class="px-2.5 py-1 rounded cursor-pointer ${state.logViewTab==='steps' ? 'bg-[var(--card)] font-medium' : 'text-[var(--muted-foreground)]'}">执行步骤树</button>
              <button onclick="state.logViewTab='raw';render();" class="px-2.5 py-1 rounded cursor-pointer ${state.logViewTab==='raw' ? 'bg-[var(--card)] font-medium' : 'text-[var(--muted-foreground)]'}">原始 Payload</button>
            </div>
          </div>

          <div class="flex-1 p-3.5 overflow-y-auto thin-scroll space-y-3">
            <!-- Token & 缓存命中卡 -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
              <div class="p-2.5 rounded-lg bg-[var(--content)] border border-[var(--card-border)]">
                <div class="text-[10px] text-[var(--muted-foreground)]">Input Tokens</div>
                <div class="font-mono font-semibold text-sm">${active.inputTokens.toLocaleString()}</div>
              </div>
              <div class="p-2.5 rounded-lg bg-[var(--content)] border pill-soft-success">
                <div class="text-[10px]">Cached 命中</div>
                <div class="font-mono font-semibold text-sm">${active.cachedTokens.toLocaleString()} (${hitRate}%)</div>
              </div>
              <div class="p-2.5 rounded-lg bg-[var(--content)] border border-[var(--card-border)]">
                <div class="text-[10px] text-[var(--muted-foreground)]">Output Tokens</div>
                <div class="font-mono font-semibold text-sm">${active.outputTokens}</div>
              </div>
              <div class="p-2.5 rounded-lg bg-[var(--content)] border border-[var(--card-border)] flex items-center justify-center">
                <button onclick="showToast('已复制完整请求与响应 JSON 到剪贴板','success')" class="px-2.5 py-1.5 rounded border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--secondary)] text-[11px] cursor-pointer">复制完整 JSON</button>
              </div>
            </div>

            ${state.logViewTab === 'steps' ? `
              <div class="space-y-2">
                ${active.steps.map(st => `
                  <div class="p-3 rounded-lg border border-[var(--border)] bg-[var(--content)] text-xs space-y-1.5">
                    <div class="flex items-center justify-between">
                      <span class="font-semibold flex items-center gap-1.5">
                        <span class="px-1.5 py-0.5 rounded text-[10px] ${st.type==='tool_call' ? 'pill-soft-primary border' : 'pill-soft-success border'}">Step ${st.step}</span>

                      <span class="text-[11px] text-[var(--muted-foreground)]">${st.ms} ms</span>
                    </div>
                    ${st.type === 'tool_call' ? `
                      <div class="font-mono text-[11px] bg-[var(--card)] p-2 rounded border border-[var(--card-border)] text-[var(--muted-foreground)]">入参: ${esc(st.args)}</div>
                      <div class="text-[11px] text-[var(--foreground)]">返回: ${esc(st.result)}</div>
                    ` : `
                      <div class="text-xs text-[var(--foreground)]">${esc(st.preview)}</div>
                    `}
                  </div>
                `).join('')}
              </div>
            ` : `
              <pre class="p-3 rounded-lg bg-[var(--content)] border border-[var(--border)] font-mono text-[11px] overflow-x-auto leading-relaxed">${esc(JSON.stringify(active.rawMessages, null, 2))}</pre>
            `}
          </div>
        </div>
      ` : '';

      return renderSplitOrStack(isMobile, masterHtml, detailHtml, '选择一条生成记录');

    // ----- ③ 缓存水位与存档压平 -----
    function renderCacheTab(isMobile) {

                      <div class="h-full bg-[var(--primary)] transition-all" style="width:${pct}%"></div>
                      <div title="低水位 L=${w.low}" class="absolute top-0 bottom-0 w-0.5 bg-[var(--warning)]" style="left:${lowPct}%"></div>
                    </div>
                    <div class="text-[10px] text-[var(--muted-foreground)] flex justify-between">
                      <span>L=${(w.low/1000).toFixed(0)}k · 已归档 ${w.chunks} 块</span>

                    <button onclick="compactContext(${idx})" class="w-full py-1.5 rounded border border-[var(--border)] hover:bg-[var(--secondary)] text-[11px] cursor-pointer ${isMobile ? 'touch-target' : ''}">立即分块归档至 L</button>

          <div class="bg-[var(--content)] border border-[var(--border)] rounded-xl p-4 space-y-3">

      const tmp = ag.blocks[idx];
      ag.blocks[idx] = ag.blocks[target];
      ag.blocks[target] = tmp;
      render();
    }

      const active = getActiveTool();

        JSON.parse(inp);
        state.toolTestInput = inp;
        state.toolTestOutput = `[iframe 沙箱] Zod 参数校验通过\n[锚定上下文] target = { messageId: 12, swipeId: 0 }\n[返回值] "${active.name} 执行成功 (耗时 42ms，已安全清理内部定时器)"`;

      }
      render();
    }

    // ----- ⑦ 正则清洗 -----
    function computeRegexOutputHtml(rule, sample) {
      if (!rule) return '';
      try {
        const m = rule.pattern.match(/^\/([\s\S]*)\/([gimsuy]*)$/);
        const re = m ? new RegExp(m[1], m[2]) : new RegExp(rule.pattern, 'g');
        const out = sample.replace(re, rule.replace);
        return `<div class="text-[11px] text-[var(--muted-foreground)] mb-1">替换后输出：</div><pre class="p-2.5 rounded bg-[var(--card)] border pill-soft-success font-mono whitespace-pre-wrap">${esc(out)}</pre>`;
      } catch (err) {
        return `<div class="p-2 rounded border pill-soft-error">正则语法错误：${esc(err.message)}</div>`;
      }
    }

    function updateRegexPreview() {
      const box = document.getElementById('regex-preview-output');
      if (box) {
        box.innerHTML = computeRegexOutputHtml(getActiveRegex(), state.regexSampleInput);
      }
    }

              <input type="text" value="${esc(active.replace)}" oninput="getActiveRegex().replace=this.value;updateRegexPreview();" class="w-full px-2.5 py-1.5 rounded-lg bg-[var(--content)] border border-[var(--border)] font-mono ${inpCls}" />
            </div>
          </div>

          <div class="p-3 rounded-xl border border-[var(--border)] bg-[var(--content)] space-y-2">
            <div class="font-semibold">实时正则替换预览（自研引擎，独立于 ST 宿主）</div>
            <textarea oninput="state.regexSampleInput=this.value;updateRegexPreview();" rows="4" class="w-full p-2.5 rounded bg-[var(--card)] border border-[var(--card-border)] font-mono ${inpCls}">${esc(state.regexSampleInput)}</textarea>
            <div id="regex-preview-output">${computeRegexOutputHtml(active, state.regexSampleInput)}</div>
          </div>
        </div>
      `;

      return renderSplitOrStack(isMobile, masterHtml, detailHtml, '选择正则规则');
    }

    function getActiveRegex() { return state.regexRules.find(r => r.id === state.selectedRegexId) || state.regexRules[0]; }

    // ----- ⑧ 世界书路由 -----
    function renderWITab(isMobile) {
      const classLabel = {
        system_rule: ['① 静态系统指令 (进 Layer 0)', 'pill-soft-primary'],
        core_manifest: ['② 核心必读清单 (进 Manifest)', 'pill-soft-success'],
        on_demand_archive: ['③ 按需档案库 (尾部去重雷达)', 'border-[var(--border)] bg-[var(--card)]'],
        dynamic_or_trigger: ['④ 动态/脚本剥离 (走触发或尾部)', 'pill-soft-warning'],
      };

      return `
        <div class="p-4 space-y-4 overflow-y-auto h-full">
          <div class="flex items-center justify-between flex-wrap gap-2">
            <div class="flex p-0.5 rounded-lg bg-[var(--content)] border border-[var(--border)] text-xs">
              <button onclick="state.wiSubTab='router';render();" class="px-3 py-1.5 rounded-md cursor-pointer ${state.wiSubTab==='router'?'bg-[var(--card)] font-medium shadow-sm':'text-[var(--muted-foreground)]'}">中文卡 WI 四类分流预览与纠偏</button>
              <button onclick="state.wiSubTab='preset_files';render();" class="px-3 py-1.5 rounded-md cursor-pointer ${state.wiSubTab==='preset_files'?'bg-[var(--card)] font-medium shadow-sm':'text-[var(--muted-foreground)]'}">预设文件管理 (/preset/*)</button>
            </div>
            <span class="text-[11px] text-[var(--muted-foreground)]">空壳角色卡补偿：<strong class="text-[var(--success)]">已自动激活</strong></span>
          </div>

          ${state.wiSubTab === 'router' ? `
            <div class="space-y-2">
              ${state.wiEntries.map((w, idx) => {
                const eff = w.overrideClass === 'auto' ? w.autoClass : w.overrideClass;
                const [lbl, cls] = classLabel[eff];
                return `
                  <div class="p-3 rounded-xl border border-[var(--border)] bg-[var(--content)] flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
                    <div class="space-y-1">
                      <div class="font-medium">${esc(w.comment)} <span class="text-[11px] text-[var(--muted-foreground)] font-normal">(${w.chars}字)</span></div>
                      <div class="text-[11px] text-[var(--muted-foreground)]">特征：${esc(w.flag)} · <span class="px-1.5 py-0.5 rounded border text-[10px] ${cls}">${lbl}</span></div>
                    </div>
                    <select onchange="state.wiEntries[${idx}].overrideClass=this.value;showToast('已更新条目路由归属');render();" class="px-2.5 py-1.5 rounded-lg bg-[var(--card)] border border-[var(--border)] ${isMobile ? 'mobile-control w-full' : 'text-xs'}">
                      <option value="auto" ${w.overrideClass==='auto'?'selected':''}>自动识别</option>
                      <option value="system_rule" ${w.overrideClass==='system_rule'?'selected':''}>锁定 ① 静态系统指令</option>
                      <option value="core_manifest" ${w.overrideClass==='core_manifest'?'selected':''}>锁定 ② 核心必读清单</option>
                      <option value="on_demand_archive" ${w.overrideClass==='on_demand_archive'?'selected':''}>锁定 ③ 按需检索档案</option>
                      <option value="dynamic_or_trigger" ${w.overrideClass==='dynamic_or_trigger'?'selected':''}>锁定 ④ 动态/脚本剥离</option>
                    </select>
                  </div>
                `;
              }).join('')}
            </div>
          ` : `
            <div class="space-y-2.5">
              ${state.presetFiles.map(pf => `
                <div class="p-3 rounded-xl border border-[var(--border)] bg-[var(--content)] space-y-2 text-xs">
                  <div class="flex items-center justify-between font-mono font-semibold">
                    <span>/preset/${esc(pf.name)}</span>
                    <span class="text-[11px] text-[var(--muted-foreground)] font-sans">${esc(pf.size)}</span>
                  </div>
                  <pre class="p-2.5 rounded bg-[var(--card)] border border-[var(--card-border)] text-[11px] overflow-x-auto">${esc(pf.preview)}</pre>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }

    // ----- ⑨ API 连接 -----
    function renderConnectionsTab(isMobile) {
      const active = state.connections.find(c => c.id === state.selectedConnId) || state.connections[0];
      const inpCls = isMobile ? 'mobile-control' : 'text-xs';

      const masterHtml = `
        <div class="p-2.5 space-y-1.5 overflow-y-auto h-full">
          ${state.connections.map(c => `
            <button onclick="state.selectedConnId='${c.id}'; state.connTestStatus=''; ${isMobile ? 'state.mobilePushDetail=true;' : ''} render();" class="w-full text-left p-2.5 rounded-lg border cursor-pointer ${active.id===c.id && !isMobile ? 'bg-[var(--content)] border-[var(--primary)]/50' : 'border-[var(--card-border)] hover:bg-[var(--secondary)]'}">
              <div class="text-xs font-semibold truncate">${esc(c.name)}</div>
              <div class="mt-1 text-[10px] font-mono text-[var(--muted-foreground)] truncate">${esc(c.model)}</div>
            </button>
          `).join('')}
        </div>
      `;

      const detailHtml = `
        <div class="p-4 space-y-3 overflow-y-auto h-full text-xs">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="sm:col-span-2">
              <label class="text-[11px] text-[var(--muted-foreground)] block mb-1">Endpoint (Base URL)</label>
              <input type="text" value="${esc(active.baseUrl)}" class="w-full px-2.5 py-1.5 rounded-lg bg-[var(--content)] border border-[var(--border)] font-mono ${inpCls}" />
            </div>
            <div>
              <label class="text-[11px] text-[var(--muted-foreground)] block mb-1">Model ID</label>
              <input type="text" value="${esc(active.model)}" class="w-full px-2.5 py-1.5 rounded-lg bg-[var(--content)] border border-[var(--border)] font-mono ${inpCls}" />
            </div>
            <div>
              <label class="text-[11px] text-[var(--muted-foreground)] block mb-1">前缀缓存协议策略</label>
              <select onchange="getActiveConn().cachePolicy=this.value;render();" class="w-full px-2.5 py-1.5 rounded-lg bg-[var(--content)] border border-[var(--border)] ${inpCls}">
                <option value="auto_prefix" ${active.cachePolicy==='auto_prefix'?'selected':''}>自动前缀缓存 (OpenAI / DeepSeek / Gemini)</option>
                <option value="anthropic_explicit" ${active.cachePolicy==='anthropic_explicit'?'selected':''}>显式断点标记 (Anthropic / OpenRouter Claude)</option>
              </select>
            </div>
            <div>
              <label class="text-[11px] text-[var(--muted-foreground)] block mb-1">Context Size / Max Tokens</label>
              <input type="text" value="${active.contextSize} / ${active.maxTokens}" class="w-full px-2.5 py-1.5 rounded-lg bg-[var(--content)] border border-[var(--border)] font-mono ${inpCls}" />
            </div>
            <div>
              <label class="text-[11px] text-[var(--muted-foreground)] block mb-1">最大并发数 (Max Concurrency)</label>
              <input type="number" value="${active.maxConcurrency}" class="w-full px-2.5 py-1.5 rounded-lg bg-[var(--content)] border border-[var(--border)] ${inpCls}" />
            </div>
          </div>
          <div>
            <label class="text-[11px] text-[var(--muted-foreground)] block mb-1">自定义 Request Headers (YAML)</label>
            <textarea rows="2" class="w-full p-2.5 rounded-lg bg-[var(--content)] border border-[var(--border)] font-mono ${inpCls}">${esc(active.headersYaml)}</textarea>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="state.connTestStatus='✓ 握手成功 (312ms) · 已确认支持 ' + (getActiveConn().cachePolicy==='anthropic_explicit'?'cache_control 显式断点':'自动前缀缓存'); render();" class="px-3 py-1.5 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-medium cursor-pointer ${isMobile ? 'touch-target' : ''}">🔌 测试连通与缓存策略</button>
          </div>
          ${state.connTestStatus ? `<div class="p-2.5 rounded-lg border pill-soft-success">${esc(state.connTestStatus)}</div>` : ''}
        </div>
      `;

      return renderSplitOrStack(isMobile, masterHtml, detailHtml, '选择连接');
    }

    function getActiveConn() { return state.connections.find(c => c.id === state.selectedConnId) || state.connections[0]; }

    // 桌面双栏 <-> 移动 Master-Detail 页面栈核心容器
    function renderSplitOrStack(isMobile, masterHtml, detailHtml, detailTitle) {
      if (isMobile) {
        if (state.mobilePushDetail) {
          return `
            <div class="flex flex-col h-full">
              <div class="px-3 py-2 bg-[var(--sidebar)] border-b border-[var(--border)] flex items-center gap-2 shrink-0">
                <button onclick="state.mobilePushDetail=false;render();" class="px-2.5 py-1.5 rounded-lg border border-[var(--border)] bg-[var(--card)] text-xs font-medium touch-target flex items-center gap-1 cursor-pointer">
                  ← 返回列表
                </button>
                <span class="text-xs font-semibold truncate">${esc(detailTitle)}</span>
              </div>
              <div class="flex-1 overflow-y-auto">${detailHtml}</div>
            </div>
          `;
        }
        return `<div class="h-full overflow-y-auto">${masterHtml}</div>`;
      }
      return `
        <div class="grid grid-cols-12 h-full">
          <div class="col-span-4 border-r border-[var(--border)] bg-[var(--sidebar)]/50 overflow-hidden">${masterHtml}</div>
          <div class="col-span-8 overflow-hidden">${detailHtml}</div>
        </div>
      `;
    }

    // =========================================================================
    // 6. 场景 B & C：桌面大一统控制台 & 移动端 390×844 壳层
    // =========================================================================
    function renderConsoleHeader(isMobile) {
      return `
        <div class="px-3.5 py-2.5 bg-[var(--sidebar)] border-b border-[var(--border)] flex flex-wrap items-center justify-between gap-2 shrink-0">
          <div class="flex items-center gap-2">
            <span class="font-semibold text-sm flex items-center gap-1.5">⚡ ST-Agentic</span>
            ${!isMobile ? `<span class="text-[10px] px-1.5 py-0.5 rounded shadow-boundary-badge text-[var(--primary)]">Shadow DOM 隔离 & 键盘防穿透</span>` : ''}
          </div>
          <div class="flex flex-wrap items-center gap-1.5 text-xs">
            <div class="flex p-0.5 rounded-lg bg-[var(--content)] border border-[var(--border)]">
              ${[['off','关'], ['companion','伴生'], ['takeover','接管']].map(([m, lbl]) => `
                <button onclick="setRunMode('${m}')" class="px-2 py-1 rounded text-[11px] cursor-pointer ${state.runMode===m ? 'bg-[var(--primary)] text-[var(--primary-foreground)] font-medium' : 'text-[var(--muted-foreground)]'}">${lbl}</button>
              `).join('')}
            </div>
            ${!isMobile ? `
              <select onchange="state.currentPreset=this.value;showToast('已切换预设');" class="px-2 py-1 rounded-lg bg-[var(--content)] border border-[var(--border)] text-xs">
                <option ${state.currentPreset==='群像通用 Agent 预设'?'selected':''}>群像通用 Agent 预设</option>
                <option ${state.currentPreset==='单人深度扮演 (低开销)'?'selected':''}>单人深度扮演 (低开销)</option>
              </select>
            ` : ''}
            <button onclick="setTheme(state.theme==='dark'?'light':'dark')" title="切换控制台深浅色主题" class="px-2 py-1 rounded-lg border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--secondary)] text-xs cursor-pointer ${isMobile ? 'touch-target' : ''}">${state.theme==='dark'?'🌙':'☀️'}</button>
            <button onclick="showImportMenu()" class="px-2.5 py-1 rounded-lg border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--secondary)] text-xs cursor-pointer ${isMobile ? 'touch-target' : ''}">导入 / 嵌卡 ▾</button>
          </div>
        </div>
      `;
    }

    function renderDesktopConsole() {
      const groups = ['当前会话', '预设与系统'];
      return `
        <div class="max-w-6xl w-full bg-[var(--card)] border border-[var(--border)] rounded-2xl shadow-2xl overflow-hidden flex flex-col" style="height: 680px;">
          ${renderConsoleHeader(false)}
          <div class="flex-1 flex min-h-0">
            <!-- 左侧双分组 9 项导航 -->
            <aside class="w-52 shrink-0 bg-[var(--sidebar)] border-r border-[var(--border)] p-2.5 overflow-y-auto thin-scroll space-y-4">
              ${groups.map(g => `
                <div class="space-y-1">
                  <div class="px-2 text-[10px] font-semibold uppercase tracking-wider text-[var(--muted-foreground)]">${g}</div>
                  ${NAV_ITEMS.filter(n => n.group === g).map(n => `
                    <button onclick="switchTab('${n.id}')" class="w-full text-left px-2.5 py-2 rounded-lg text-xs transition cursor-pointer flex flex-col ${state.activeTab===n.id ? 'bg-[var(--primary)] text-[var(--primary-foreground)] shadow-sm' : 'hover:bg-[var(--secondary)] text-[var(--foreground)]'}">
                      <span class="font-medium">${n.label}</span>
                      <span class="text-[10px] ${state.activeTab===n.id ? 'opacity-85' : 'text-[var(--muted-foreground)]'}">${n.desc}</span>
                    </button>
                  `).join('')}
                </div>
              `).join('')}
            </aside>
            <!-- 右侧全高主画布 -->
            <section class="flex-1 min-w-0 bg-[var(--card)] overflow-hidden">
              ${renderActiveTabContent(false)}
            </section>
          </div>
        </div>
      `;
    }

    function renderMobileConsole() {
      return `
        <div class="flex flex-col items-center gap-3 w-full">
          <div class="text-xs text-[var(--muted-foreground)] flex flex-wrap items-center justify-center gap-2">
            <span>📱 模拟 390×844 竖屏视口：</span>
            <span class="px-2 py-0.5 rounded bg-[var(--card)] border border-[var(--border)]">单栏推入栈</span>
            <span class="px-2 py-0.5 rounded bg-[var(--card)] border border-[var(--border)]">表单 ≥16px 防 iOS 放大</span>
            <span class="px-2 py-0.5 rounded bg-[var(--card)] border border-[var(--border)]">触控热区 ≥40px</span>
          </div>
          <div class="mobile-shell bg-[var(--card)] flex flex-col">
            ${renderConsoleHeader(true)}
            <!-- 顶部横滑分组胶囊 -->
            <div class="shrink-0 bg-[var(--content)] border-b border-[var(--border)] px-2 py-2 flex items-center gap-1.5 overflow-x-auto thin-scroll">
              ${NAV_ITEMS.map(n => `
                <button onclick="switchTab('${n.id}', false)" class="shrink-0 px-3 py-1.5 rounded-full text-xs font-medium touch-target cursor-pointer border ${state.activeTab===n.id ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-transparent' : 'bg-[var(--card)] border-[var(--border)] text-[var(--muted-foreground)]'}">${n.short}</button>
              `).join('')}
            </div>
            <div class="flex-1 min-h-0 overflow-hidden bg-[var(--card)]">
              ${renderActiveTabContent(true)}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 7. 总渲染调度
    // =========================================================================
    function render() {
      const scope = document.getElementById('theme-scope');
      if (scope) scope.setAttribute('data-theme', state.theme);

      ['dark', 'light'].forEach(t => {
        const tb = document.getElementById('theme-btn-' + t);
        if (tb) {
          tb.className = `px-2 py-1 rounded-md cursor-pointer flex items-center gap-1 transition ${
            state.theme === t ? 'bg-[var(--primary)] text-[var(--primary-foreground)] shadow-sm font-medium' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'
          }`;
        }
      });

      ['chat', 'desktop', 'mobile'].forEach(s => {
        const btn = document.getElementById('scene-' + s);
        if (btn) {
          btn.className = `px-2.5 py-1.5 rounded-md text-xs font-medium transition cursor-pointer flex items-center gap-1.5 ${
            state.scene === s ? 'bg-[var(--primary)] text-[var(--primary-foreground)] shadow-sm' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'
          }`;
        }
      });

      const root = document.getElementById('app-root');
      if (state.scene === 'chat') root.innerHTML = renderChatScene();
      else if (state.scene === 'desktop') root.innerHTML = renderDesktopConsole();
      else root.innerHTML = renderMobileConsole();
    }

    render();
  </script>
</body>
</html>
