<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ST-Agentic 助手 &amp; 线外协作 UI 原型</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    select, input, textarea {
      max-width: 100%;
      min-width: 0;
    }
    .thin-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .thin-scroll::-webkit-scrollbar-track { background: transparent; }
    .thin-scroll::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--muted-foreground) 28%, transparent);
      border-radius: 9999px;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }

    .pill-soft-primary {
      background: color-mix(in srgb, var(--primary) 14%, transparent);
      color: var(--primary);
      border-color: color-mix(in srgb, var(--primary) 34%, transparent);
    }
    .pill-soft-success {
      background: color-mix(in srgb, var(--success) 14%, transparent);
      color: var(--success);
      border-color: color-mix(in srgb, var(--success) 34%, transparent);
    }
    .pill-soft-warning {
      background: color-mix(in srgb, var(--warning) 14%, transparent);
      color: var(--warning);
      border-color: color-mix(in srgb, var(--warning) 34%, transparent);
    }
    .pill-soft-error {
      background: color-mix(in srgb, var(--error) 14%, transparent);
      color: var(--error);
      border-color: color-mix(in srgb, var(--error) 34%, transparent);
    }
    .pill-soft-muted {
      background: color-mix(in srgb, var(--muted-foreground) 12%, transparent);
      color: var(--muted-foreground);
      border-color: color-mix(in srgb, var(--border) 85%, transparent);
    }
    .diff-del {
      background: color-mix(in srgb, var(--error) 15%, transparent);
      color: var(--error);
    }
    .diff-add {
      background: color-mix(in srgb, var(--success) 15%, transparent);
      color: var(--success);
    }
    .diff-ctx {
      color: var(--muted-foreground);
    }
    .shadow-boundary-badge {
      background: color-mix(in srgb, var(--primary) 10%, transparent);
      border: 1px dashed color-mix(in srgb, var(--primary) 42%, transparent);
    }
    .mobile-shell {
      width: 390px;
      height: 844px;
      max-width: 100%;
      border-radius: 28px;
      border: 6px solid var(--border);
      overflow: hidden;
      box-shadow: 0 24px 60px color-mix(in srgb, var(--foreground) 16%, transparent);
    }
    .mobile-control {
      font-size: 16px !important;
      min-height: 40px;
    }
    .touch-target {
      min-height: 40px;
      min-width: 40px;
    }

    /* Shadow DOM 独立 Dark / Light 双主题色板（与 src/ui/shell/styles.ts 一致） */
    #theme-scope[data-theme="dark"] {
      --background: #14161b;
      --sidebar: #1b1e25;
      --content: #101216;
      --card: #20242c;
      --border: #2f3542;
      --card-border: #2a303c;
      --foreground: #e6e9ef;
      --muted-foreground: #9aa3b2;
      --primary: #6c8cff;
      --primary-foreground: #ffffff;
      --secondary: #2a303c;
      --secondary-foreground: #e6e9ef;
      --success: #34d399;
      --warning: #fbbf24;
      --error: #f87171;
      color-scheme: dark;
    }
    #theme-scope[data-theme="light"] {
      --background: #f4f6fa;
      --sidebar: #eef1f6;
      --content: #f8fafc;
      --card: #ffffff;
      --border: #dbe1eb;
      --card-border: #e5eaf2;
      --foreground: #181c24;
      --muted-foreground: #5f697a;
      --primary: #3b66f5;
      --primary-foreground: #ffffff;
      --secondary: #e8edf5;
      --secondary-foreground: #181c24;
      --success: #10b981;
      --warning: #d97706;
      --error: #dc2626;
      color-scheme: light;
    }
  </style>
</head>

  </header>

  <div id="modal-overlay" onclick="if(event.target===this) closeModal();" class="hidden fixed inset-0 z-40 bg-black/65 backdrop-blur-sm items-center justify-center p-3 sm:p-4">

// =========================================================================
// 3. 工具与辅助函数
// =========================================================================
function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function getActiveSession() {
  return state.sessions.find(s => s.id === state.selectedSessionId) || state.sessions[0];
}

function getConnectionMeta(connId) {
  return CONNECTION_OPTIONS.find(c => c.id === connId) || CONNECTION_OPTIONS[0];
}

function countPendingApprovals(session) {
  let count = 0;
  for (const m of session.messages) {
    if (Array.isArray(m.approvals)) {
      for (const aid of m.approvals) {
        if (state.approvals[aid]?.status === 'pending') count += 1;
      }
    }
  }
  return count;
}

function countAllPendingApprovals() {
  return Object.values(state.approvals).filter(a => a.status === 'pending').length;
}

function showToast(msg, tone = 'primary') {
  const box = document.getElementById('toast-box');
  const el = document.createElement('div');
  const toneCls =
    tone === 'success' ? 'pill-soft-success' :
    tone === 'warning' ? 'pill-soft-warning' :
    tone === 'error' ? 'pill-soft-error' : 'pill-soft-primary';
  el.className = `pointer-events-auto px-3.5 py-2 rounded-xl border text-xs font-medium shadow-lg bg-[var(--card)] ${toneCls} max-w-sm`;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

function openModal(title, bodyHtml, footerHtml = null) {
  document.getElementById('modal-title').innerHTML = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-footer').innerHTML = footerHtml || `
    <button onclick="closeModal()" class="touch-target px-3.5 py-1.5 rounded-lg border border-[var(--border)] bg-[var(--card)] text-xs cursor-pointer hover:bg-[var(--secondary)]">关闭</button>
  `;
  const ov = document.getElementById('modal-overlay');
  ov.classList.remove('hidden');
  ov.classList.add('flex');
}

function closeModal() {
  const ov = document.getElementById('modal-overlay');
  ov.classList.add('hidden');
  ov.classList.remove('flex');
}

function formatSimpleMarkdown(text) {
  const escaped = esc(text);
  return escaped
    .replace(/`([^`]+)`/g, '<code class="px-1 py-0.5 rounded bg-[var(--content)] border border-[var(--card-border)] font-mono text-[11px] text-[var(--primary)] break-all">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong class="font-semibold text-[var(--foreground)]">$1</strong>')
    .replace(/\n/g, '<br/>');
}

function highlightRedacted(text) {
  return esc(text).replace(
    /\*\*\*REDACTED\*\*\*/g,
    '<span class="px-1 py-0.2 rounded bg-[var(--warning)]/20 text-[var(--warning)] font-semibold">***REDACTED***</span>',
  );
}

function getEffectivePills(session) {
  if (session.mode !== 'full') {
    return MODE_META[session.mode].pills;
  }
  if (session.stAdminEnabled) {
    return [
      { text: '写: 全库世界书 / 角色卡 / 人设 / 正则', cls: 'pill-soft-error' },
      { text: '系统: ST 设置 / 预设 / 斜杠 / URL 导入', cls: 'pill-soft-error' },
      { text: '红线: 高危强制确认 + Key 脱敏 + 撤销', cls: 'pill-soft-warning' },
    ];
  }
  return [
    { text: '写: 全部已开启的世界书', cls: 'pill-soft-warning' },
    { text: '写: 含写卡 & 调整模式全部能力', cls: 'pill-soft-primary' },
    { text: 'ST 全局管家: 未启用', cls: 'pill-soft-muted' },
  ];
}

// =========================================================================
// 4. 交互行为控制器
// =========================================================================
function setTheme(theme) {
  state.theme = theme;
  render();
}

function switchScene(scene) {
  state.scene = scene;
  state.openPopover = null;
  render();
}

function switchTab(tabId) {
  state.activeTab = tabId;
  state.openPopover = null;
  if (tabId === 'assistant') state.mobileViewStack = 'list';
  if (tabId === 'sidegen') state.mobileSideStack = 'list';
  render();
}

function togglePopover(name) {
  state.openPopover = state.openPopover === name ? null : name;
  render();
}

function closePopover() {
  if (state.openPopover) {
    state.openPopover = null;
    render();
  }
}

function setRunMode(mode) {
  state.runMode = mode;
  const label = mode === 'takeover' ? '完全接管' : mode === 'companion' ? '伴生模式' : '已关闭';
  showToast(`主线运行模式：${label}`, mode === 'off' ? 'warning' : 'success');
  render();
}

function createNewAssistantSession() {
  const cur = getActiveSession();
  const id = 'ast_' + Date.now();
  const newSess = {
    id,
    title: `新助手对话 (${MODE_META[cur.mode].label})`,

    stAdminEnabled: cur.mode === 'full' ? cur.stAdminEnabled : false,
    autoApproveAuthor: false,
    connectionId: cur.connectionId || 'inherit',
    updatedAt: '刚刚',
    messages: [

        id: 'm_init_' + id,

        content:

  state.sessions.unshift(newSess);

  state.mobileViewStack = 'detail';
  state.openPopover = null;

  render();

function selectAssistantSession(sessionId) {
  state.selectedSessionId = sessionId;
  state.mobileViewStack = 'detail';

  render();
}

function setAssistantMode(mode) {
  const s = getActiveSession();
  s.mode = mode;

    s.stAdminEnabled = false;
  }
  showToast(`已切换为：${MODE_META[mode].fullLabel}`, mode === 'full' ? 'warning' : 'primary');
  if (mode !== 'full' && mode !== 'author') {
    state.openPopover = null;
  }
  render();
}

function setAssistantConnection(connId) {
  const s = getActiveSession();
  s.connectionId = connId;
  state.openPopover = null;
  showToast(`模型已切换为：${getConnectionMeta(connId).shortLabel}`, 'primary');
  render();
}

function toggleAutoApproveAuthor(checked) {

function approveAction(approvalId) {
  const appr = state.approvals[approvalId];
  if (!appr || appr.status !== 'pending') return;
  appr.status = 'approved';
  state.expandedApprovalDetail[approvalId] = false;

  const undoId = 'undo_' + Date.now() + '_' + Math.floor(Math.random() * 100);
  appr.undoId = undoId;

  state.undoStack.unshift({
    id: undoId,
    sessionId: appr.sessionId,
    toolCallId: appr.id,
    toolName: appr.toolName,
    label: appr.title,
    scope: appr.targetLabel,
    beforeSummary: appr.diffLines.filter(l => l.type === 'del').map(l => l.text.slice(2)).join(' / ') || '（新增资产：写入前为空）',
    afterSummary: appr.diffLines.filter(l => l.type === 'add').map(l => l.text.slice(2)).slice(0, 2).join(' / ') || appr.summary,
    timestamp: '刚刚',
    reverted: false,
  });

  showToast(`✓ 已接受并落盘：${appr.title}`, 'success');
  render();
}

function rejectAction(approvalId) {
  const appr = state.approvals[approvalId];
  if (!appr || appr.status !== 'pending') return;
  appr.status = 'rejected';
  state.expandedApprovalDetail[approvalId] = false;
  showToast(`✕ 已拒绝：${appr.title}（可随时点击重试重新生成）`, 'warning');
  render();
}

function retryApproval(approvalId) {
  const appr = state.approvals[approvalId];
  if (!appr) return;
  appr.revision = (appr.revision || 1) + 1;
  appr.status = 'pending';
  appr.undoId = null;
  state.expandedApprovalDetail[approvalId] = true;

  // 在模拟 Diff 中体现重试后的改进版本
  const revTag = `[第 ${appr.revision} 版] `;
  if (!appr.title.startsWith('[')) {
    appr.title = revTag + appr.title;
  } else {
    appr.title = appr.title.replace(/^\[第 \d+ 版\]\s*/, revTag);
  }
  if (appr.toolName === 'wi_upsert_primary_entry') {
    appr.diffLines = [
      { type: 'ctx', text: `  # 女主好感阶段动态指引 (UID 18 · 第 ${appr.revision} 版优化)` },
      { type: 'del', text: '- 女主当前态度：普通相识，保持客套。' },
      { type: 'add', text: '+ @@system' },
      { type: 'add', text: `+ <% if ((getvar('女主好感') || 0) >= ${60 + (appr.revision - 1) * 5}) { %>` },
      { type: 'add', text: '+ - [亲密阶段] 林婉儿已卸下防备，主动传递密信线索（避免过度主动抢话）。' },
      { type: 'add', text: '+ <% } else { %>' },
      { type: 'add', text: '+ - [戒备阶段] 林婉儿仍保持疏离试探。' },
      { type: 'add', text: '+ <% } %>' },
    ];
  } else if (appr.diffLines.length > 0) {
    const last = appr.diffLines[appr.diffLines.length - 1];
    if (!last.text.includes('优化版')) {
      appr.diffLines.push({ type: 'add', text: `+ // 第 ${appr.revision} 版精简优化` });
    }
  }

  showToast(`↻ 已重新生成修改方案（第 ${appr.revision} 版），请确认`, 'primary');
  render();
}

function applyUndo(undoId) {
  const rec = state.undoStack.find(u => u.id === undoId);
  if (!rec || rec.reverted) return;
  rec.reverted = true;

  for (const appr of Object.values(state.approvals)) {
    if (appr.undoId === undoId) {
      appr.reverted = true;
    }
  }
  showToast(`↩ 已还原写前快照：${rec.label}`, 'success');
  render();
}

function sendAssistantPrompt() {
  if (state.streamingTimer) {
    stopSimulatedStream();
    return;
  }
  const session = getActiveSession();
  const text = (state.draft || '').trim();
  if (!text) {
    showToast('请输入指令后再发送', 'warning');
    return;
  }

  state.draft = '';
  state.openPopover = null;

  session.messages.push({
    id: 'm_u_' + Date.now(),
    role: 'user',
    content: text,
    timestamp: '刚刚',
  });
  session.updatedAt = '刚刚';

  const replyId = 'm_ai_' + Date.now();
  const script = buildSimulatedReplyScript(session, text, replyId);

  const aiMsg = {
    id: replyId,
    role: 'assistant',
    think: script.think,
    content: '',
    toolCalls: script.toolCalls,
    approvals: [],
    streaming: true,
    usage: null,
    timestamp: '生成中...',
  };
  session.messages.push(aiMsg);
  state.streamingSessionId = session.id;
  render(true);

  const tokens = script.fullContent.split('');
  let cursor = 0;
  state.streamingTimer = setInterval(() => {
    const step = Math.max(2, Math.ceil(tokens.length / 26));
    cursor = Math.min(tokens.length, cursor + step);
    aiMsg.content = tokens.slice(0, cursor).join('');
    if (cursor >= tokens.length) {
      clearInterval(state.streamingTimer);
      state.streamingTimer = null;
      state.streamingSessionId = null;
      aiMsg.streaming = false;
      aiMsg.timestamp = '刚刚';
      aiMsg.usage = script.usage;
      if (script.newApprovals) {
        for (const appr of script.newApprovals) {
          state.approvals[appr.id] = appr;
          aiMsg.approvals.push(appr.id);
        }
      }
      if (script.newUndo) {
        state.undoStack.unshift(script.newUndo);
      }
      render(true);
    } else {
      const streamEl = document.getElementById(`msg-content-${replyId}`);
      if (streamEl) {
        streamEl.innerHTML = formatSimpleMarkdown(aiMsg.content) + '<span class="inline-block w-1.5 h-3.5 ml-0.5 bg-[var(--primary)] animate-pulse align-middle"></span>';
      }
    }
  }, 35);
}

function stopSimulatedStream() {
  if (!state.streamingTimer) return;
  clearInterval(state.streamingTimer);
  state.streamingTimer = null;
  const sess = state.sessions.find(s => s.id === state.streamingSessionId);
  if (sess) {
    const last = sess.messages[sess.messages.length - 1];
    if (last && last.streaming) {
      last.streaming = false;
      last.content += '\n\n*[已手动中止流式生成]*';
      last.timestamp = '已中止';
    }
  }
  state.streamingSessionId = null;
  showToast('已停止当前助手生成', 'warning');
  render();
}

  const apprId = 'appr_full_sim_' + Date.now();
  return {
    think: 'ST 全权管家已开启，请求修改 power_user 配置属于高危强制审批项，弹出不可跳过审批卡。',
    fullContent: '检测到涉及 ST 全局配置修改（高危操作，**不可自动跳过**），请确认：',
    toolCalls: [],
    newApprovals: [
      {
        id: apprId,
        sessionId: session.id,
        toolName: 'st_settings_patch',
        riskLevel: 'high',
        mandatoryConfirm: true,
        revision: 1,
        title: '修改 ST 全局设置 (power_user)',
        summary: '调整 allowScopedScripts 与 fast_ui_mode',
        targetLabel: 'ST 全权管家 · 全局设置',
        status: 'pending',
        undoId: null,
        rawContent: '{\n  "allowScopedScripts": true,\n  "fast_ui_mode": false\n}',
        diffLines: [
          { type: 'del', text: '- "fast_ui_mode": true' },
          { type: 'add', text: '+ "fast_ui_mode": false' },
          { type: 'ctx', text: '  "allowScopedScripts": true' },
        ],
      },
    ],
    usage: { inputTokens: 2290, cachedTokens: 1980, outputTokens: 115, cacheRate: '86.5%' },
  };
}

// =========================================================================
// 5. 助手工作台视图渲染 (`assistant`) — 极简顶栏 + 底部合并输入组
// =========================================================================
function renderSessionListPanel(isMobile) {
  const active = getActiveSession();
  const undoCount = state.undoStack.filter(u => !u.reverted).length;
  return `
    <div class="flex flex-col h-full bg-[var(--sidebar)]">
      <div class="p-2.5 border-b border-[var(--border)] flex items-center justify-between gap-2 shrink-0">
        <button onclick="createNewAssistantSession()" class="flex-1 touch-target px-3 py-1.5 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-semibold flex items-center justify-center gap-1 cursor-pointer hover:opacity-90 shadow-sm">
          <span>＋ 新建助手会话</span>
        </button>
        ${!isMobile ? `<button onclick="closePopover()" class="touch-target px-2.5 py-1.5 rounded-xl border border-[var(--border)] bg-[var(--card)] text-xs cursor-pointer hover:bg-[var(--secondary)]">✕</button>` : ''}
      </div>

      <div class="flex-1 overflow-y-auto thin-scroll p-2 space-y-1.5">
        ${state.sessions.map(s => {
          const meta = MODE_META[s.mode];
          const pending = countPendingApprovals(s);
          const selected = s.id === active.id;
          return `
            <button onclick="selectAssistantSession('${s.id}')" class="w-full text-left p-2.5 rounded-xl border transition cursor-pointer touch-target ${selected ? 'bg-[var(--card)] border-[var(--primary)]/60 shadow-sm' : 'border-[var(--card-border)] bg-[var(--content)]/60 hover:bg-[var(--secondary)]'}">
              <div class="flex items-center justify-between gap-1.5">
                <span class="text-xs font-semibold truncate text-[var(--foreground)]">${esc(s.title)}</span>
                ${pending > 0 ? `<span class="shrink-0 px-1.5 py-0.5 rounded-full text-[10px] font-semibold border pill-soft-warning">待审 ${pending}</span>` : ''}
              </div>
              <div class="mt-1.5 flex items-center justify-between gap-1.5 text-[11px]">
                <span class="px-1.5 py-0.5 rounded border text-[10px] font-medium ${meta.pillClass}">${meta.icon} ${meta.label}${s.mode === 'full' && s.stAdminEnabled ? ' · 管家' : ''}</span>
                <span class="text-[10px] text-[var(--muted-foreground)]">${s.messages.length} 条 · ${esc(s.updatedAt)}</span>
              </div>
            </button>
          `;
        }).join('')}
      </div>

      <div class="p-2.5 border-t border-[var(--border)] shrink-0 bg-[var(--sidebar)]">
        <button onclick="openUndoDrawer()" class="w-full touch-target px-3 py-1.5 rounded-xl border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--secondary)] text-xs font-medium flex items-center justify-between cursor-pointer">
          <span>↩ 写前快照撤销历史</span>
          <span class="px-1.5 py-0.5 rounded-full text-[10px] border ${undoCount > 0 ? 'pill-soft-warning' : 'pill-soft-muted'}">${undoCount}</span>
        </button>
      </div>
    </div>
  `;
}

function renderModePopover(session) {

      </div>

      <div class="space-y-1.5">
        ${['chat', 'adjust', 'author', 'full'].map(m => {

          <div>

            <div class="text-[10px] text-[var(--muted-foreground)]">常规写卡直接落盘；高危仍强制确认</div>

          <div>
            <div class="font-semibold text-xs">🛡️ ST 全权管家</div>
            <div class="text-[10px] opacity-85">全库卡片/世界书/设置/预设/斜杠/导入</div>
          </div>
          <span class="px-2 py-0.5 rounded-full border text-[10px] font-semibold shrink-0">${session.stAdminEnabled ? '已启用' : '关闭'}</span>

      ` : ''}

      <div class="flex flex-wrap gap-1 pt-1 border-t border-[var(--card-border)]">
        ${scopePills.map(p => `<span class="px-1.5 py-0.5 rounded border text-[10px] ${p.cls}">${esc(p.text)}</span>`).join('')}

  `;
}

function renderModelPopover(session) {
  return `
    <div class="absolute bottom-full left-2.5 right-2.5 sm:left-3 sm:right-auto sm:w-[300px] mb-2 z-30 bg-[var(--card)] border border-[var(--border)] rounded-2xl shadow-2xl p-2.5 space-y-1.5 text-xs max-h-[340px] overflow-y-auto thin-scroll">
      <div class="px-1 pb-1.5 border-b border-[var(--border)] flex items-center justify-between gap-2">
        <span class="font-semibold text-xs">助手独立模型连接</span>
        <button onclick="closePopover()" class="px-2 py-0.5 rounded-lg hover:bg-[var(--secondary)] text-[var(--muted-foreground)] cursor-pointer text-xs">✕</button>
      </div>
      ${CONNECTION_OPTIONS.map(c => {
        const active = session.connectionId === c.id;
        return `
          <button onclick="setAssistantConnection('${c.id}')" class="w-full touch-target px-2.5 py-2 rounded-xl border text-left cursor-pointer flex items-center justify-between gap-2 ${active ? 'bg-[var(--primary)]/12 border-[var(--primary)]/55 text-[var(--primary)] font-semibold' : 'bg-[var(--content)] border-[var(--card-border)] hover:bg-[var(--secondary)] text-[var(--foreground)]'}">
            <span class="truncate">${esc(c.label)}</span>
            ${active ? '<span class="shrink-0">✓</span>' : ''}
          </button>
        `;

}

function renderAssistantTab(isMobile) {
  const session = getActiveSession();
  const activeMode = MODE_META[session.mode];
  const connMeta = getConnectionMeta(session.connectionId);
  const undoCount = state.undoStack.filter(u => !u.reverted).length;
  const isStreaming = Boolean(state.streamingTimer && state.streamingSessionId === session.id);

  if (isMobile && state.mobileViewStack === 'list') {
    return renderSessionListPanel(true);
  }

  // 1. 超薄单行顶栏（~46px）：仅会话切换 + 标题 + 新建 + 撤销历史
  const topBarHtml = `
    <div class="shrink-0 min-h-[46px] py-1 px-2.5 sm:px-3 border-b border-[var(--border)] bg-[var(--sidebar)]/75 flex items-center justify-between gap-2">
      <div class="flex items-center gap-1.5 min-w-0 flex-1">
        ${isMobile ? `
          <button onclick="state.mobileViewStack='list';state.openPopover=null;render();" title="会话列表" class="touch-target px-2 rounded-xl border border-[var(--border)] bg-[var(--card)] text-xs font-medium cursor-pointer flex items-center justify-center shrink-0">←</button>
        ` : `
          <button onclick="togglePopover('sessions')" title="打开助手会话列表" class="px-2.5 py-1 rounded-xl border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--secondary)] text-xs font-medium cursor-pointer flex items-center gap-1 shrink-0">
            <span>☰</span>
            <span>会话 (${state.sessions.length})</span>
          </button>
        `}
        <span class="text-xs font-semibold truncate text-[var(--foreground)]" title="${esc(session.title)}">${esc(session.title)}</span>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <button onclick="createNewAssistantSession()" title="新建助手会话" class="touch-target px-2.5 rounded-xl border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--secondary)] text-xs font-semibold cursor-pointer flex items-center justify-center">＋</button>
        <button onclick="openUndoDrawer()" title="写前快照撤销历史" class="touch-target px-2.5 rounded-xl border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--secondary)] text-xs font-medium cursor-pointer flex items-center justify-center gap-1">
          <span>↩</span>
          ${undoCount > 0 ? `<span class="font-mono text-[11px] text-[var(--warning)] font-semibold">${undoCount}</span>` : ''}
        </button>
      </div>
    </div>
  `;

  // 2. 主对话流（最大化视口占比）
  const messagesHtml = `
    <div id="assistant-scroll-box" class="flex-1 overflow-y-auto thin-scroll p-3 sm:p-4 space-y-3 bg-[var(--content)] min-w-0">
      ${session.messages.map(m => renderAssistantMessage(m, isMobile)).join('')}
    </div>
  `;

  // 3. 底部极简输入组（模型选择 + 模式选择全部合并在内，砍掉快捷指令与手动附带上下文）
  const popoverBackdropHtml = (state.openPopover === 'mode' || state.openPopover === 'model')
    ? `<div onclick="closePopover()" class="absolute inset-0 z-20 bg-black/25"></div>`
    : '';

  const modePillLabel = session.mode === 'full' && session.stAdminEnabled
    ? '⚡ 管家'
    : `${activeMode.icon} ${activeMode.label}`;
  const modePillCls = session.mode === 'full' && session.stAdminEnabled
    ? 'pill-soft-error'
    : activeMode.pillClass;

  const composerHtml = `
    <div class="shrink-0 bg-[var(--sidebar)] px-2 sm:px-3 py-1.5 sm:py-2 border-t border-[var(--border)] relative">
      ${state.openPopover === 'mode' ? renderModePopover(session) : ''}
      ${state.openPopover === 'model' ? renderModelPopover(session) : ''}
      <div class="rounded-2xl border border-[var(--border)] bg-[var(--content)] px-2.5 pt-2 pb-1.5 focus-within:border-[var(--primary)] transition">
        <textarea
          id="assistant-draft-input"
          rows="1"
          oninput="state.draft=this.value"
          onkeydown="if(event.key==='Enter' && !event.shiftKey && !event.isComposing && !state.streamingTimer){event.preventDefault();sendAssistantPrompt();}"
          placeholder="输入指令，让助手自行读取并处理..."
          class="w-full bg-transparent border-0 focus:outline-none resize-none leading-snug ${isMobile ? 'mobile-control' : 'text-xs py-1'}"
        >${esc(state.draft)}</textarea>

        <div class="flex items-center justify-between gap-2 pt-1">
          <div class="flex items-center gap-1.5 min-w-0">
            <button onclick="togglePopover('mode')" title="切换助手权限模式" class="touch-target px-2.5 rounded-xl border text-xs font-semibold cursor-pointer flex items-center gap-1 whitespace-nowrap shrink-0 ${modePillCls}">
              <span>${modePillLabel}</span>
              <span class="opacity-70 text-[10px]">▾</span>
            </button>
            <button onclick="togglePopover('model')" title="切换助手模型连接" class="touch-target px-2.5 rounded-xl border ${state.openPopover === 'model' ? 'pill-soft-primary' : 'border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] hover:bg-[var(--secondary)]'} text-xs cursor-pointer flex items-center gap-1 min-w-0 truncate">
              <span class="truncate">${esc(connMeta.shortLabel)}</span>
              <span class="opacity-70 text-[10px] shrink-0">▾</span>
            </button>
          </div>

          ${isStreaming ? `
            <button onclick="stopSimulatedStream()" title="停止生成" aria-label="停止生成" class="touch-target w-10 h-10 shrink-0 rounded-xl bg-[var(--error)] text-white text-sm font-semibold cursor-pointer hover:opacity-90 shadow-sm flex items-center justify-center"><span class="leading-none">■</span></button>
          ` : `
            <button onclick="sendAssistantPrompt()" title="发送 (Enter)" aria-label="发送" class="touch-target w-10 h-10 shrink-0 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-sm font-semibold cursor-pointer hover:opacity-90 shadow-sm flex items-center justify-center"><span class="leading-none">▶</span></button>
          `}
        </div>
      </div>
    </div>
  `;

  const desktopSessionsDrawer = (!isMobile && state.openPopover === 'sessions') ? `
    <div onclick="if(event.target===this) closePopover();" class="absolute inset-0 z-30 bg-black/35 flex justify-start">
      <div class="w-72 h-full border-r border-[var(--border)] shadow-2xl overflow-hidden">
        ${renderSessionListPanel(false)}
      </div>
    </div>
  ` : '';

  return `
    <div class="relative flex flex-col h-full min-h-0 min-w-0">
      ${topBarHtml}
      ${messagesHtml}
      ${popoverBackdropHtml}
      ${composerHtml}
      ${desktopSessionsDrawer}
    </div>
  `;
}

function renderAssistantMessage(m, isMobile) {
  if (m.role === 'user') {
    return `
      <div class="flex justify-end min-w-0">
        <div class="max-w-[88%] sm:max-w-[78%] min-w-0 rounded-2xl rounded-tr-sm bg-[var(--primary)]/16 border border-[var(--primary)]/35 px-3 py-2 text-xs">
          <div class="leading-relaxed text-[var(--foreground)] break-words">${formatSimpleMarkdown(m.content)}</div>
        </div>
      </div>
    `;
  }

  const toolCalls = Array.isArray(m.toolCalls) ? m.toolCalls : [];
  const hasActivity = Boolean(m.think) || toolCalls.length > 0;
  const activityExpanded = Boolean(state.expandedActivity[m.id]);
  const totalMs = toolCalls.reduce((sum, tc) => sum + (tc.durationMs || 0), 0);
  const redactedAny = toolCalls.some(tc => tc.hasSecretRedaction);
  const activeUndoTool = toolCalls.find(tc => tc.undoId && state.undoStack.find(u => u.id === tc.undoId));
  const activeUndoRec = activeUndoTool ? state.undoStack.find(u => u.id === activeUndoTool.undoId) : null;
  const approvals = Array.isArray(m.approvals) ? m.approvals.map(id => state.approvals[id]).filter(Boolean) : [];

  const summaryParts = [];
  if (m.think) summaryParts.push('已思考');
  if (toolCalls.length > 0) {
    const names = toolCalls.map(tc => tc.name).slice(0, 2).join(', ');
    summaryParts.push(`${toolCalls.length} 次工具 (${names}${toolCalls.length > 2 ? '…' : ''})`);
  }
  if (totalMs > 0) summaryParts.push(`${totalMs}ms`);

  return `
    <div class="flex justify-start min-w-0">
      <div class="w-full max-w-[98%] sm:max-w-[92%] min-w-0 rounded-2xl rounded-tl-sm bg-[var(--card)] border border-[var(--card-border)] px-3 py-2.5 text-xs space-y-2 shadow-sm">
        ${hasActivity ? `
          <div class="rounded-lg bg-[var(--content)] border border-[var(--card-border)] overflow-hidden min-w-0">
            <div class="px-2.5 py-1 flex items-center justify-between gap-2 text-[11px]">
              <button onclick="toggleActivityExpand('${m.id}')" class="flex items-center gap-1.5 min-w-0 text-left text-[var(--muted-foreground)] hover:text-[var(--foreground)] cursor-pointer flex-1">
                <span class="text-[var(--success)] shrink-0">✓</span>
                <span class="truncate">${esc(summaryParts.join(' · '))}</span>
                ${redactedAny ? `<span class="shrink-0 px-1 rounded border text-[10px] pill-soft-warning">🔒 已脱敏</span>` : ''}
                <span class="shrink-0 opacity-75">${activityExpanded ? '▾' : '▸'}</span>
              </button>
              ${activeUndoRec ? `
                <button ${activeUndoRec.reverted ? 'disabled' : ''} onclick="applyUndo('${activeUndoRec.id}')" class="shrink-0 px-2 py-0.5 rounded border text-[10px] font-medium cursor-pointer ${activeUndoRec.reverted ? 'border-[var(--border)] text-[var(--muted-foreground)] cursor-not-allowed' : 'pill-soft-warning hover:opacity-85'}">
                  ${activeUndoRec.reverted ? '已还原' : '↩ 撤销'}
                </button>
              ` : ''}
            </div>

            ${activityExpanded ? `
              <div class="px-2.5 pb-2.5 pt-1.5 border-t border-[var(--card-border)] space-y-1.5">
                ${m.think ? `<div class="text-[11px] text-[var(--muted-foreground)] leading-relaxed break-words">💭 ${esc(m.think)}</div>` : ''}
                ${toolCalls.map(tc => renderToolCallCard(tc)).join('')}
              </div>
            ` : ''}
          </div>
        ` : ''}

        <div id="msg-content-${m.id}" class="leading-relaxed text-[var(--foreground)] break-words">
          ${m.content ? formatSimpleMarkdown(m.content) : ''}
          ${m.streaming ? '<span class="inline-block w-1.5 h-3.5 ml-0.5 bg-[var(--primary)] animate-pulse align-middle"></span>' : ''}
        </div>

        ${Array.isArray(m.fileRefs) && m.fileRefs.length > 0 ? `
          <div class="flex flex-wrap items-center gap-1.5">
            ${m.fileRefs.map(fp => `
              <button onclick="openFilePreviewModal('${esc(fp)}')" class="px-2 py-0.5 rounded-md border border-[var(--border)] bg-[var(--content)] hover:bg-[var(--secondary)] font-mono text-[10px] text-[var(--primary)] cursor-pointer max-w-full truncate">
                📄 ${esc(fp)}
              </button>
            `).join('')}
          </div>
        ` : ''}

        <!-- 直接附着在 AI 输出气泡内的审批操作区（接受 / 拒绝 / 重试） -->
        ${approvals.length > 0 ? `
          <div class="pt-2 mt-1 border-t border-[var(--card-border)] space-y-2 min-w-0">
            ${approvals.map(appr => renderAttachedApprovalBlock(appr, isMobile)).join('')}
          </div>
        ` : ''}

        <div class="flex items-center justify-between gap-2 text-[10px] text-[var(--muted-foreground)] font-mono pt-0.5">
          <span>${m.usage ? `缓存 ${m.usage.cacheRate} · ${m.usage.outputTokens} tok` : 'Agentic 助手'}</span>
          <span>${esc(m.timestamp)}</span>
        </div>
      </div>
    </div>
  `;
}

function renderToolCallCard(tc) {
  const expanded = Boolean(state.expandedTools[tc.id]);
  const undoRec = tc.undoId ? state.undoStack.find(u => u.id === tc.undoId) : null;
  return `
    <div class="rounded-lg border border-[var(--border)] bg-[var(--sidebar)] overflow-hidden min-w-0">
      <div class="px-2 py-1 flex flex-wrap items-center justify-between gap-1.5">
        <button onclick="toggleToolExpand('${tc.id}')" class="flex flex-wrap items-center gap-1.5 text-[11px] cursor-pointer text-left min-w-0">
          <span class="font-mono font-semibold text-[var(--foreground)]">${esc(tc.name)}</span>
          <span class="px-1 rounded border text-[10px] pill-soft-primary">${esc(tc.scopeLabel)}</span>
          ${tc.hasSecretRedaction ? `<span class="px-1 rounded border text-[10px] pill-soft-warning">🔒 Key已脱敏</span>` : ''}
          <span class="text-[10px] text-[var(--muted-foreground)]">${tc.durationMs}ms ${expanded ? '▾' : '▸'}</span>
        </button>

        ${undoRec ? `
          <button ${undoRec.reverted ? 'disabled' : ''} onclick="applyUndo('${undoRec.id}')" class="px-1.5 py-0.5 rounded border text-[10px] font-medium cursor-pointer ${undoRec.reverted ? 'border-[var(--border)] text-[var(--muted-foreground)] cursor-not-allowed' : 'pill-soft-warning hover:opacity-85'}">
            ${undoRec.reverted ? '✓ 已撤销' : '↩ 撤销此步'}
          </button>
        ` : ''}
      </div>

      ${expanded ? `
        <div class="px-2 pb-2 pt-1 border-t border-[var(--card-border)] space-y-1 text-[10px] font-mono min-w-0">
          <pre class="p-1.5 rounded bg-[var(--content)] max-w-full overflow-x-auto whitespace-pre-wrap break-all">Args: ${esc(tc.args)}</pre>
          <pre class="p-1.5 rounded bg-[var(--content)] max-w-full overflow-x-auto whitespace-pre-wrap break-all">${highlightRedacted(tc.result)}</pre>
        </div>
      ` : ''}
    </div>
  `;
}

function renderAttachedApprovalBlock(appr, isMobile) {
  const undoRec = appr.undoId ? state.undoStack.find(u => u.id === appr.undoId) : null;
  const detailExpanded = Boolean(state.expandedApprovalDetail[appr.id]);

  // 已处理（接受或拒绝）：自动折叠为 1 行紧凑条
  if (appr.status !== 'pending' && !detailExpanded) {
    const isRejected = appr.status === 'rejected';
    const isReverted = Boolean(undoRec?.reverted);
    return `
      <div class="rounded-xl border ${isRejected ? 'border-[var(--error)]/40' : isReverted ? 'border-[var(--warning)]/40' : 'border-[var(--success)]/40'} bg-[var(--content)] px-2.5 py-1.5 flex items-center justify-between gap-2 text-[11px] min-w-0">
        <div class="flex items-center gap-1.5 min-w-0">
          <span class="shrink-0 font-bold ${isRejected ? 'text-[var(--error)]' : isReverted ? 'text-[var(--warning)]' : 'text-[var(--success)]'}">
            ${isRejected ? '✕' : isReverted ? '↩' : '✓'}
          </span>
          <span class="truncate font-medium">${isRejected ? `已拒绝：${esc(appr.title)}` : isReverted ? `已还原：${esc(appr.title)}` : `已接受：${esc(appr.title)}`}</span>
        </div>
        <div class="flex items-center gap-1 shrink-0">
          <button onclick="toggleApprovalExpand('${appr.id}')" class="px-2 py-0.5 rounded border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--secondary)] text-[10px] cursor-pointer">详情</button>
          ${isRejected ? `
            <button onclick="retryApproval('${appr.id}')" class="px-2 py-0.5 rounded border pill-soft-primary text-[10px] font-medium cursor-pointer hover:opacity-85">↻ 重试</button>
          ` : undoRec ? `
            <button ${undoRec.reverted ? 'disabled' : ''} onclick="applyUndo('${undoRec.id}')" class="px-2 py-0.5 rounded border text-[10px] font-medium cursor-pointer ${undoRec.reverted ? 'border-[var(--border)] text-[var(--muted-foreground)] cursor-not-allowed' : 'pill-soft-warning hover:opacity-85'}">
              ${undoRec.reverted ? '已还原' : '↩ 撤销'}
            </button>
          ` : ''}
        </div>
      </div>
    `;
  }

  const viewMode = state.approvalViewMode[appr.id] || 'diff';

  return `
    <div class="rounded-xl border ${appr.status === 'pending' ? (appr.riskLevel === 'high' ? 'border-[var(--error)]/60' : 'border-[var(--warning)]/60') : 'border-[var(--border)]'} bg-[var(--content)] p-2.5 space-y-2 min-w-0">
      <div class="flex items-center justify-between gap-1.5">
        <div class="flex items-center gap-1.5 min-w-0 flex-1">
          ${appr.riskLevel === 'high' ? `<span class="px-1.5 py-0.2 rounded border text-[10px] font-semibold pill-soft-error shrink-0">🔒 强制确认</span>` : ''}
          <span class="font-semibold text-xs truncate text-[var(--foreground)]">${esc(appr.title)}</span>
        </div>
        <div class="flex items-center gap-1 shrink-0">
          <div class="flex p-0.5 rounded-md bg-[var(--sidebar)] border border-[var(--border)] text-[10px]">
            <button onclick="toggleApprovalView('${appr.id}', 'diff')" class="px-1.5 py-0.5 rounded cursor-pointer ${viewMode === 'diff' ? 'bg-[var(--card)] font-medium shadow-sm' : 'text-[var(--muted-foreground)]'}">Diff</button>
            <button onclick="toggleApprovalView('${appr.id}', 'raw')" class="px-1.5 py-0.5 rounded cursor-pointer ${viewMode === 'raw' ? 'bg-[var(--card)] font-medium shadow-sm' : 'text-[var(--muted-foreground)]'}">原文</button>
          </div>
          ${appr.status !== 'pending' ? `<button onclick="toggleApprovalExpand('${appr.id}')" class="px-1.5 py-0.5 rounded border border-[var(--border)] text-[10px] cursor-pointer">收起</button>` : ''}
        </div>
      </div>

      ${viewMode === 'diff' ? `
        <div class="rounded-lg border border-[var(--border)] bg-[var(--sidebar)] font-mono text-[11px] max-w-full overflow-x-auto divide-y divide-[var(--card-border)]/40">
          ${appr.diffLines.map(line => `
            <div class="px-2 py-0.5 whitespace-pre-wrap break-all ${line.type === 'del' ? 'diff-del' : line.type === 'add' ? 'diff-add' : 'diff-ctx'}">${esc(line.text)}</div>
          `).join('')}
        </div>
      ` : `
        <pre class="p-2 rounded-lg border border-[var(--border)] bg-[var(--sidebar)] font-mono text-[11px] max-w-full overflow-x-auto whitespace-pre-wrap break-all">${esc(appr.rawContent)}</pre>
      `}

      ${appr.status === 'pending' ? `
        <div class="flex flex-wrap items-center justify-between gap-2 pt-0.5">
          <span class="text-[10px] text-[var(--muted-foreground)] font-mono truncate">${esc(appr.toolName)}</span>
          <div class="flex items-center gap-1.5 shrink-0">
            <button onclick="retryApproval('${appr.id}')" class="touch-target px-2.5 py-1 rounded-lg border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--secondary)] text-xs font-medium cursor-pointer">
              ↻ 重试
            </button>
            <button onclick="rejectAction('${appr.id}')" class="touch-target px-2.5 py-1 rounded-lg border border-[var(--error)]/45 pill-soft-error text-xs font-medium cursor-pointer hover:opacity-85">
              ✕ 拒绝
            </button>
            <button onclick="approveAction('${appr.id}')" class="touch-target px-3 py-1 rounded-lg ${appr.riskLevel === 'high' ? 'bg-[var(--error)] text-white' : 'bg-[var(--primary)] text-[var(--primary-foreground)]'} text-xs font-semibold cursor-pointer hover:opacity-90 shadow-sm">
              ✓ 接受
            </button>
          </div>
        </div>
      ` : appr.status === 'rejected' ? `
        <div class="flex justify-end">
          <button onclick="retryApproval('${appr.id}')" class="touch-target px-3 py-1 rounded-lg border pill-soft-primary text-xs font-medium cursor-pointer">↻ 重试生成方案</button>
        </div>
      ` : ''}
    </div>
  `;
}

// =========================================================================
// 6. SideGen 线外会话与线索管理视图 (`sidegen`)
// =========================================================================
function updateClueDelivery(clueId, delivery) {
  const clue = state.sideClues.find(c => c.id === clueId);
  if (!clue) return;
  clue.delivery = delivery;
  const opt = DELIVERY_OPTIONS.find(d => d.value === delivery);
  showToast(`已更新投递策略：${opt?.short || delivery}`, 'success');
  render();
}

function updateClueStatus(clueId, status) {
  const clue = state.sideClues.find(c => c.id === clueId);
  if (!clue) return;
  clue.status = status;
  showToast(`线索状态：${status === 'resolved' ? '已回收' : status === 'surfaced' ? '已浮现' : '潜伏中'}`, 'primary');
  render();
}

function exportClueToWorldInfo(clueId) {
  const clue = state.sideClues.find(c => c.id === clueId);
  if (!clue) return;
  openModal(
    '📤 导出线索到 ST 真实世界书',
    `
      <div class="space-y-3">
        <div class="p-2.5 rounded-xl border pill-soft-success">✓ 确认后将写入真实世界书，跨聊天永久生效。</div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          <div>

            <select class="w-full px-2.5 py-1.5 rounded-lg bg-[var(--content)] border border-[var(--border)] text-xs">
              <option>玄幻世界（当前绑定主世界书）</option>
              <option>现代都市暗线档案</option>
            </select>
          </div>
          <div>
            <label class="text-[11px] text-[var(--muted-foreground)] block mb-1">触发关键词</label>

  );
}

function viewSideSessionTranscript(sessionId) {

function runSdkQuickTest() {
  if (state.sdkTestMode === 'runOnce') {
    state.sdkOutput =
      '[runOnce 完成 · 640ms · 0 残留]\n' +
      '塔楼飞檐之上，那道玄色身影听见下方井沿微响，指尖轻轻叩了两下石栏：“终于摸到铜环了么……看来十点之前的风声得压一压。”';
  } else {
    const sess = state.sideSessions.find(s => s.id === state.sdkTargetSession) || state.sideSessions[0];
    if (!sess) {
      state.sdkOutput = '[提示] 当前无可用持久会话，请切换为 runOnce()。';
      showToast('无可用目标会话', 'warning');
      render();
      return;
    }
    state.sdkTargetSession = sess.id;
    sess.turns += 1;
    sess.tokens += 240;
    sess.transcript.push({ role: 'user', text: state.sdkUserPrompt });
    const replyText = '明白，我把撬锁细钩和红外遮罩装进背包，九点四十在老码头灯塔西侧汇合。';
    sess.transcript.push({ role: 'assistant', text: replyText });
    const clue = state.sideClues.find(c => c.sourceSessionId === sess.id);
    if (clue) {
      clue.content += `\n- [刚刚 User]: ${state.sdkUserPrompt}\n- [刚刚 林晚]: ${replyText}`;
      clue.radarStatus = 'updated';
      clue.updatedAt = '刚刚';
    }
    state.sdkOutput =
      `[send("${sess.id}") 完成 · 缓存命中 94.2%]\n` +
      `回复：${replyText}\n` +
      `桥接：${clue ? `已更新 ${sess.bridgePath}，xxHash 变更 -> 主线下次提及关键词将触发 [已更新]` : '未开启自动桥接'}`;
  }
  showToast('SideGen SDK 模拟调用完成', 'success');
  render();
}

  const validTargetSession = state.sideSessions.find(s => s.id === state.sdkTargetSession) || state.sideSessions[0];
  const effectiveTargetId = validTargetSession ? validTargetSession.id : 'phone:linwan';

  const generatedCode = state.sdkTestMode === 'runOnce'
    ? `const res = await Agentic.sideGen.runOnce({\n  systemPrompt: ${JSON.stringify(state.sdkSystemPrompt)},\n  prompt: ${JSON.stringify(state.sdkUserPrompt)},\n  mainChatDepth: 4,\n});`

            <label class="text-[11px] text-[var(--muted-foreground)] block mb-1">调用模式</label>
            <select onchange="state.sdkTestMode=this.value;state.sdkOutput='';render();" class="w-full px-2.5 py-1.5 rounded-lg bg-[var(--content)] border border-[var(--border)] ${isMobile ? 'mobile-control' : 'text-xs'}">
              <option value="send" ${state.sdkTestMode === 'send' ? 'selected' : ''}>send() — 持久线外会话</option>
              <option value="runOnce" ${state.sdkTestMode === 'runOnce' ? 'selected' : ''}>runOnce() — 一次性小插曲</option>
            </select>
          </div>
          ${state.sdkTestMode === 'send' ? `
            <div>
              <label class="text-[11px] text-[var(--muted-foreground)] block mb-1">目标会话 ID</label>
              <select onchange="state.sdkTargetSession=this.value;render();" class="w-full px-2.5 py-1.5 rounded-lg bg-[var(--content)] border border-[var(--border)] ${isMobile ? 'mobile-control' : 'text-xs'}">
                ${state.sideSessions.length === 0
                  ? '<option value="">(无持久会话)</option>'
                  : state.sideSessions.map(ss => `<option value="${esc(ss.id)}" ${effectiveTargetId === ss.id ? 'selected' : ''}>${esc(ss.id)} (${esc(ss.title)})</option>`).join('')}
              </select>
            </div>
          ` : `
            <div>
              <label class="text-[11px] text-[var(--muted-foreground)] block mb-1">系统指令</label>
              <input type="text" value="${esc(state.sdkSystemPrompt)}" oninput="state.sdkSystemPrompt=this.value" class="w-full px-2.5 py-1.5 rounded-lg bg-[var(--content)] border border-[var(--border)] ${isMobile ? 'mobile-control' : 'text-xs'}" />
            </div>
          `}
        </div>

        <div>
          <label class="text-[11px] text-[var(--muted-foreground)] block mb-1">输入提示词 / 消息</label>
          <textarea rows="2" oninput="state.sdkUserPrompt=this.value" class="w-full p-2.5 rounded-lg bg-[var(--content)] border border-[var(--border)] ${isMobile ? 'mobile-control' : 'text-xs'}">${esc(state.sdkUserPrompt)}</textarea>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <button onclick="runSdkQuickTest()" class="touch-target px-3.5 py-1.5 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-semibold cursor-pointer">▶ 模拟执行 SDK</button>
          <button onclick="navigator.clipboard?.writeText(${esc(JSON.stringify(generatedCode))});showToast('已复制 JS 代码','success');" class="touch-target px-3 py-1.5 rounded-lg border border-[var(--border)] bg-[var(--sidebar)] hover:bg-[var(--secondary)] text-xs cursor-pointer">📋 复制代码</button>
        </div>

        <pre class="p-2.5 rounded-xl bg-[var(--content)] border border-[var(--border)] font-mono text-[11px] max-w-full overflow-x-auto whitespace-pre-wrap break-all text-[var(--primary)]">${esc(generatedCode)}</pre>

        ${state.sdkOutput ? `
          <div class="p-3 rounded-xl border pill-soft-success font-mono text-[11px] whitespace-pre-wrap break-words leading-relaxed">${esc(state.sdkOutput)}</div>
        ` : ''}
      </div>
    </div>
  `;
}

function renderBaseTabPlaceholder(tabId) {
  const item = NAV_ITEMS.find(n => n.id === tabId);
  return `
    <div class="h-full flex items-center justify-center p-6 bg-[var(--content)]">
      <div class="max-w-md w-full p-5 rounded-2xl border border-[var(--border)] bg-[var(--card)] text-center space-y-3 shadow-sm">
        <div class="text-sm font-semibold">${esc(item?.group || '')} · ${esc(item?.label || tabId)}</div>
        <p class="text-xs text-[var(--muted-foreground)] leading-relaxed">
          该视图已由主架构原型（<code>docs/ui-prototype.html</code>）覆盖并落地至 <code>src/ui/</code>。本原型聚焦极简版 <strong>「线外协作」</strong> 界面设计。
        </p>
        <div class="flex flex-wrap justify-center gap-2 pt-1">
          <button onclick="switchTab('assistant')" class="touch-target px-3.5 py-1.5 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-semibold cursor-pointer">前往助手工作台</button>
          <button onclick="switchTab('sidegen')" class="touch-target px-3.5 py-1.5 rounded-lg border border-[var(--border)] bg-[var(--sidebar)] hover:bg-[var(--secondary)] text-xs cursor-pointer">前往线外与线索</button>
        </div>
      </div>
    </div>
  `;
}

// =========================================================================
// 7. 控制台壳层与三场景渲染
// =========================================================================
function renderConsoleHeader(isMobile) {
  return `
    <div class="px-3 py-1.5 bg-[var(--sidebar)] border-b border-[var(--border)] flex items-center justify-between gap-2 shrink-0 min-h-[44px]">
      <div class="flex items-center gap-2 min-w-0">
        <span class="font-semibold text-sm flex items-center gap-1 whitespace-nowrap">⚡ ST-Agentic</span>
        ${!isMobile ? `<span class="text-[10px] px-1.5 py-0.5 rounded shadow-boundary-badge text-[var(--primary)] truncate">Shadow DOM 隔离</span>` : ''}
      </div>
      <div class="flex items-center gap-1.5 text-xs shrink-0">
        <div class="flex p-0.5 rounded-lg bg-[var(--content)] border border-[var(--border)]">
          ${[['off','关'], ['companion','伴生'], ['takeover','接管']].map(([m, lbl]) => `
            <button onclick="setRunMode('${m}')" class="px-2 py-1 rounded text-[11px] cursor-pointer ${state.runMode === m ? 'bg-[var(--primary)] text-[var(--primary-foreground)] font-medium' : 'text-[var(--muted-foreground)]'}">${lbl}</button>
          `).join('')}
        </div>
        ${!isMobile ? `
          <select onchange="state.currentPreset=this.value;showToast('已切换预设');" class="px-2 py-1 rounded-lg bg-[var(--content)] border border-[var(--border)] text-xs max-w-[175px]">
            <option ${state.currentPreset === '群像通用 Agent 预设' ? 'selected' : ''}>群像通用 Agent 预设</option>
            <option ${state.currentPreset === '单人深度扮演 (低开销)' ? 'selected' : ''}>单人深度扮演 (低开销)</option>
          </select>
        ` : ''}
        <button onclick="setTheme(state.theme === 'dark' ? 'light' : 'dark')" title="切换主题" class="${isMobile ? 'touch-target px-2' : 'px-2 py-1'} rounded-lg border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--secondary)] text-xs cursor-pointer flex items-center justify-center">${state.theme === 'dark' ? '🌙' : '☀️'}</button>
      </div>
    </div>
  `;
}

function renderActiveTabContent(isMobile) {
  if (state.activeTab === 'assistant') return renderAssistantTab(isMobile);
  if (state.activeTab === 'sidegen') return renderSideGenTab(isMobile);
  return renderBaseTabPlaceholder(state.activeTab);
}

function renderDesktopConsole() {
  const groups = ['线外协作', '当前会话', '预设与系统'];
  const pendingTotal = countAllPendingApprovals();
  return `
    <div class="max-w-7xl w-full bg-[var(--card)] border border-[var(--border)] rounded-2xl shadow-2xl overflow-hidden flex flex-col" style="height: 740px;">
      ${renderConsoleHeader(false)}
      <div class="flex-1 flex min-h-0">
        <aside class="w-44 shrink-0 bg-[var(--sidebar)] border-r border-[var(--border)] p-2 overflow-y-auto thin-scroll space-y-3.5">
          ${groups.map(g => `
            <div class="space-y-0.5">
              <div class="px-2 pb-0.5 text-[10px] font-semibold uppercase tracking-wider text-[var(--muted-foreground)] flex items-center justify-between">
                <span>${g}</span>
                ${g === '线外协作' ? `<span class="px-1 rounded text-[9px] pill-soft-primary border">NEW</span>` : ''}
              </div>
              ${NAV_ITEMS.filter(n => n.group === g).map(n => `
                <button onclick="switchTab('${n.id}')" class="w-full text-left px-2.5 py-1.5 rounded-lg text-xs transition cursor-pointer flex flex-col ${state.activeTab === n.id ? 'bg-[var(--primary)] text-[var(--primary-foreground)] shadow-sm' : 'hover:bg-[var(--secondary)] text-[var(--foreground)]'}">
                  <div class="flex items-center justify-between gap-1">
                    <span class="font-medium truncate">${n.label}</span>
                    ${n.id === 'assistant' && pendingTotal > 0 ? `<span class="px-1.5 rounded-full text-[10px] font-semibold ${state.activeTab === n.id ? 'bg-white/25 text-white' : 'pill-soft-warning border'}">${pendingTotal}</span>` : ''}
                  </div>
                  <span class="text-[10px] truncate ${state.activeTab === n.id ? 'opacity-85' : 'text-[var(--muted-foreground)]'}">${n.desc}</span>
                </button>
              `).join('')}
            </div>
          `).join('')}
        </aside>

        <section class="flex-1 min-w-0 bg-[var(--card)] overflow-hidden">
          ${renderActiveTabContent(false)}
        </section>
      </div>
    </div>
  `;
}

function renderMobileConsole() {
  const pendingTotal = countAllPendingApprovals();
  const hideMobileChrome = state.activeTab === 'assistant' && state.mobileViewStack === 'detail';
  return `
    <div class="flex flex-col items-center gap-2 w-full">
      <div class="text-[11px] text-[var(--muted-foreground)] flex flex-wrap items-center justify-center gap-1.5">
        <span>📱 390×844 移动端：${hideMobileChrome ? '对话中已隐藏顶部标题与导航（点 ← 回会话列表显示）' : '会话列表与顶部导航视图（点会话进入沉浸对话）'} · 模式/模型合入输入组</span>
      </div>
      <div class="mobile-shell bg-[var(--card)] flex flex-col">
        ${!hideMobileChrome ? `
          ${renderConsoleHeader(true)}
          <div class="shrink-0 bg-[var(--content)] border-b border-[var(--border)] px-2 py-1 flex items-center gap-1 overflow-x-auto no-scrollbar">
            ${NAV_ITEMS.map(n => `
              <button onclick="switchTab('${n.id}')" class="shrink-0 touch-target px-2.5 py-1 rounded-lg text-xs font-medium cursor-pointer flex items-center gap-1 transition ${state.activeTab === n.id ? 'bg-[var(--primary)]/15 text-[var(--primary)] border border-[var(--primary)]/35 font-semibold' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'}">
                <span>${n.short}</span>
                ${n.id === 'assistant' && pendingTotal > 0 ? `<span class="px-1 rounded-full text-[10px] bg-[var(--warning)] text-black font-bold leading-tight">${pendingTotal}</span>` : ''}
              </button>
            `).join('')}
          </div>
        ` : ''}
        <div class="flex-1 min-h-0 overflow-hidden bg-[var(--card)]">
          ${renderActiveTabContent(true)}
        </div>
      </div>
    </div>
  `;
}

function renderHostEntryScene() {
  return `
    <div class="max-w-4xl w-full grid grid-cols-1 md:grid-cols-2 gap-4 items-start">
      <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 space-y-3 shadow-sm">
        <div class="text-sm font-semibold flex items-center justify-between gap-2">
          <span>🪄 ST 魔棒菜单挂载预览 (#extensionsMenu)</span>
          <span class="text-[10px] px-2 py-0.5 rounded-full border pill-soft-success shrink-0">零侵入深链接</span>
        </div>
        <p class="text-xs text-[var(--muted-foreground)]">
          在 SillyTavern 原生输入框左下角魔棒菜单中新增「打开 Agentic 助手」与「线外会话与线索」入口；点击即可唤起独立 Shadow DOM 控制台并定位到对应视图。
        </p>

        <div class="w-full max-w-xs bg-[var(--content)] border border-[var(--border)] rounded-xl shadow-xl p-2 space-y-1 text-xs">
          <div class="px-2.5 py-1 text-[10px] text-[var(--muted-foreground)] font-medium">ST #extensionsMenu</div>
          <button onclick="state.activeTab='assistant';switchScene('desktop');" class="w-full text-left px-2.5 py-2.5 rounded-lg bg-[var(--primary)]/12 border border-[var(--primary)]/35 hover:bg-[var(--primary)]/20 flex items-center justify-between cursor-pointer">
            <span class="font-semibold text-[var(--primary)]">🤖 打开 Agentic 助手</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded pill-soft-primary border">NEW</span>
          </button>
          <button onclick="state.activeTab='sidegen';switchScene('desktop');" class="w-full text-left px-2.5 py-2.5 rounded-lg bg-[var(--success)]/10 border border-[var(--success)]/30 hover:bg-[var(--success)]/18 flex items-center justify-between cursor-pointer">
            <span class="font-semibold text-[var(--success)]">📡 线外会话与线索</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded pill-soft-success border">NEW</span>
          </button>
          <div class="border-t border-[var(--card-border)] my-1"></div>
          <button onclick="state.activeTab='files';switchScene('desktop');" class="w-full text-left px-2.5 py-2 rounded-lg hover:bg-[var(--secondary)] flex items-center justify-between cursor-pointer">
            <span>📁 文件与内容覆盖</span><span class="text-[10px] text-[var(--muted-foreground)]">直达①</span>
          </button>
          <button onclick="state.activeTab='logs';switchScene('desktop');" class="w-full text-left px-2.5 py-2 rounded-lg hover:bg-[var(--secondary)] flex items-center justify-between cursor-pointer">
            <span>📜 查看生成日志</span><span class="text-[10px] text-[var(--muted-foreground)]">直达②</span>
          </button>
        </div>
      </div>

      <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 space-y-3 shadow-sm">
        <div class="text-sm font-semibold">📱 移动视口快速验证</div>
        <p class="text-xs text-[var(--muted-foreground)] leading-relaxed">
          点击下方按钮直接在移动端 <code>390×844</code> 极简布局下体验高屏占比交互：
        </p>
        <div class="space-y-2">
          <button onclick="state.activeTab='assistant';state.mobileViewStack='detail';switchScene('mobile');" class="w-full touch-target px-3 py-2.5 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-semibold cursor-pointer">
            📱 在手机视口打开「助手工作台」
          </button>
          <button onclick="state.activeTab='sidegen';state.mobileSideStack='list';switchScene('mobile');" class="w-full touch-target px-3 py-2.5 rounded-xl border border-[var(--border)] bg-[var(--sidebar)] hover:bg-[var(--secondary)] text-xs font-medium cursor-pointer">
            📱 在手机视口打开「线外会话与线索」
          </button>
        </div>
      </div>
    </div>
  `;
}

// =========================================================================
// 8. 总渲染调度
// =========================================================================
function render(scrollChatToBottom = false) {
  const scope = document.getElementById('theme-scope');
  if (scope) scope.setAttribute('data-theme', state.theme);

  ['dark', 'light'].forEach(t => {
    const tb = document.getElementById('theme-btn-' + t);
    if (tb) {
      tb.className = `px-2 py-1 rounded-md cursor-pointer flex items-center gap-1 transition ${
        state.theme === t ? 'bg-[var(--primary)] text-[var(--primary-foreground)] shadow-sm font-medium' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'
      }`;
    }
  });

  ['desktop', 'mobile', 'host'].forEach(s => {
    const btn = document.getElementById('scene-' + s);
    if (btn) {
      btn.className = `px-2.5 py-1.5 rounded-md text-xs font-medium transition cursor-pointer flex items-center gap-1.5 ${
        state.scene === s ? 'bg-[var(--primary)] text-[var(--primary-foreground)] shadow-sm' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'
      }`;
    }
  });

  const activeEl = document.activeElement;
  const wasDraftFocused = activeEl && activeEl.id === 'assistant-draft-input';
  const selStart = wasDraftFocused ? activeEl.selectionStart : null;
  const selEnd = wasDraftFocused ? activeEl.selectionEnd : null;

  const root = document.getElementById('app-root');
  if (state.scene === 'desktop') root.innerHTML = renderDesktopConsole();
  else if (state.scene === 'mobile') root.innerHTML = renderMobileConsole();
  else root.innerHTML = renderHostEntryScene();

  if (scrollChatToBottom) {
    const box = document.getElementById('assistant-scroll-box');
    if (box) box.scrollTop = box.scrollHeight;
  }
  if (wasDraftFocused) {
    const nextInput = document.getElementById('assistant-draft-input');
    if (nextInput) {
      nextInput.focus();
      if (selStart !== null && selEnd !== null) {
        nextInput.setSelectionRange(selStart, selEnd);
      }
    }
  }
}

render();
</script>
</body>
</html>
