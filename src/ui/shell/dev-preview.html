<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>ST-Agentic 独立 UI 预览 (dev:ui)</title>
    <style>
        :root {
            --SmartThemeBlurTintColor: rgba(20, 22, 27, 0.92);
            --SmartThemeBodyColor: #e6e9ef;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100dvh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--SmartThemeBlurTintColor);
            color: var(--SmartThemeBodyColor);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .dev-host-card {
            max-width: 560px;
            width: 100%;
            border: 1px solid rgba(128, 140, 160, 0.35);
            border-radius: 14px;
            padding: 20px;
            background: rgba(128, 140, 160, 0.08);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .dev-host-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .dev-host-btn {
            min-height: 40px;
            padding: 0 14px;
            border-radius: 8px;
            border: 1px solid rgba(128, 140, 160, 0.4);
            background: #3b66f5;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .dev-host-btn.secondary {
            background: transparent;
            color: inherit;
        }
        .dev-host-log {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed rgba(128, 140, 160, 0.35);
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="dev-host-card">
        <h1 style="margin: 0; font-size: 18px;">ST-Agentic 独立 UI 预览宿主</h1>
        <p style="margin: 0; font-size: 13px; opacity: 0.85;">
            脱离 SillyTavern 直接挂载 <code>&lt;dialog id="agentic-app"&gt;</code> Shadow DOM 控制台与 Mock 数据。
        </p>
        <div class="dev-host-actions">
            <button id="dev-open-console" type="button" class="dev-host-btn">打开控制台</button>
            <button id="dev-toggle-host-theme" type="button" class="dev-host-btn secondary">
                切换宿主背景亮度（测试 auto 主题）
            </button>
        </div>
        <div id="dev-host-keylog" class="dev-host-log">
            宿主 document keydown 监听就绪（弹窗内方向键不得冒泡至此）
        </div>
    </div>

    <script>
        (function () {
            var logEl = document.getElementById('dev-host-keylog');
            var count = 0;
            document.addEventListener('keydown', function (ev) {
                count += 1;
                if (logEl) {
                    logEl.textContent = '宿主 document 收到 keydown #' + count + ': ' + ev.key;
                }
            });
        })();
    </script>
    <script type="module" src="../../../dist/dev-preview.js"></script>
</body>
</html>
